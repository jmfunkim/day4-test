<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Space Voyage</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: system-ui, sans-serif; }
  canvas { display: block; }
  #ui { position: fixed; left: 16px; bottom: 16px; display: flex; gap: 8px; flex-wrap: wrap; }
  #ui button { background: rgba(20,30,60,.6); color: #cfe3ff; border: 1px solid #4a6fa5; border-radius: 6px;
    padding: 8px 14px; cursor: pointer; backdrop-filter: blur(4px); font-size: 14px; }
  #ui button.on { background: #2a5bd7; color: #fff; }
  #home { position: fixed; right: 16px; bottom: 16px; background: rgba(20,30,60,.6); color: #cfe3ff; border: 1px solid #4a6fa5;
    border-radius: 6px; padding: 8px 14px; font-size: 14px; text-decoration: none; backdrop-filter: blur(4px); }
  #title { position: fixed; top: 16px; left: 16px; color: #cfe3ff; font-size: 14px; opacity: .8; pointer-events: none; }
</style>
</head>
<body>
<div id="title">SPACE VOYAGE · 드래그: 회전 / 휠: 확대 / 1·2·3: 카메라</div>
<a id="home" href="index.html">← 처음으로</a>
<div id="ui">
  <button data-m="free" class="on">1 자유 시점</button>
  <button data-m="chase">2 우주선 추적</button>
  <button data-m="watch">3 관찰</button>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 4000);
camera.position.set(0, 45, 95);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.maxDistance = 400;

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.9, 0.6, 0.15);
composer.addPass(bloom);

// ---------- helpers ----------
function hash(x, y) { const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return s - Math.floor(s); }
function vnoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  return hash(xi, yi) * (1 - u) * (1 - v) + hash(xi + 1, yi) * u * (1 - v) +
         hash(xi, yi + 1) * (1 - u) * v + hash(xi + 1, yi + 1) * u * v;
}
function fbm(x, y, oct = 5) { let a = 0.5, s = 0; for (let i = 0; i < oct; i++) { s += a * vnoise(x, y); x *= 2; y *= 2; a *= 0.5; } return s; }

// colorFn(n, lat) -> [r,g,b] 0..255
function makeTexture(colorFn, w = 512, h = 256, scale = 6) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'), img = g.createImageData(w, h);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    // wrap horizontally by blending noise sampled across the seam
    const u = x / w, lat = y / h;
    const n1 = fbm(u * scale, lat * scale), n2 = fbm((u - 1) * scale, lat * scale);
    const n = n1 * (1 - u) + n2 * u;
    const [r, gg, b] = colorFn(n, lat);
    const i = (y * w + x) * 4;
    img.data[i] = r; img.data[i + 1] = gg; img.data[i + 2] = b; img.data[i + 3] = 255;
  }
  g.putImageData(img, 0, 0);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const mix = (a, b, t) => a.map((v, i) => v + (b[i] - v) * t);

function glowSprite(color, size, opacity = 1) {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d');
  const gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  gr.addColorStop(0, color); gr.addColorStop(0.25, color.replace(/[\d.]+\)$/, '0.35)')); gr.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 128, 128);
  const s = new THREE.Sprite(new THREE.SpriteMaterial({
    map: new THREE.CanvasTexture(c), blending: THREE.AdditiveBlending, depthWrite: false, transparent: true, opacity }));
  s.scale.set(size, size, 1); return s;
}

// ---------- background: stars + nebula ----------
{
  const N = 7000, pos = new Float32Array(N * 3), col = new Float32Array(N * 3);
  for (let i = 0; i < N; i++) {
    const r = 1200 + Math.random() * 600;
    const th = Math.random() * Math.PI * 2, ph = Math.acos(2 * Math.random() - 1);
    pos.set([r * Math.sin(ph) * Math.cos(th), r * Math.cos(ph), r * Math.sin(ph) * Math.sin(th)], i * 3);
    const c = new THREE.Color().setHSL(0.55 + Math.random() * 0.2 - (Math.random() < .2 ? .5 : 0), 0.4, 0.6 + Math.random() * 0.4);
    col.set([c.r, c.g, c.b], i * 3);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  const stars = new THREE.Points(g, new THREE.PointsMaterial({ size: 2.2, vertexColors: true, sizeAttenuation: false, depthWrite: false }));
  scene.add(stars);

  const nebColors = ['rgba(120,60,255,1)', 'rgba(255,60,140,1)', 'rgba(40,140,255,1)', 'rgba(60,255,200,1)'];
  for (let i = 0; i < 14; i++) {
    const s = glowSprite(nebColors[i % 4], 600 + Math.random() * 500, 0.16);
    const th = Math.random() * Math.PI * 2, ph = Math.acos(2 * Math.random() - 1), r = 900;
    s.position.set(r * Math.sin(ph) * Math.cos(th), r * Math.cos(ph) * 0.5, r * Math.sin(ph) * Math.sin(th));
    scene.add(s);
  }
}

// ---------- sun ----------
const sunTex = makeTexture((n) => mix([255, 120, 20], [255, 240, 150], n * 1.4), 512, 256, 8);
const sun = new THREE.Mesh(new THREE.SphereGeometry(6, 64, 64), new THREE.MeshBasicMaterial({ map: sunTex, color: 0xffddaa }));
scene.add(sun);
const sunGlow = glowSprite('rgba(255,170,60,1)', 40, 0.9); sun.add(sunGlow);
const sunGlow2 = glowSprite('rgba(255,100,30,1)', 90, 0.35); sun.add(sunGlow2);
scene.add(new THREE.PointLight(0xfff0d0, 3.2, 0, 0.6));
scene.add(new THREE.AmbientLight(0x223355, 0.5));

// ---------- planets ----------
const planets = [];
function addPlanet({ name, radius, orbit, speed, spin, tilt = 0, colorFn, scale, phase = 0 }) {
  const pivot = new THREE.Object3D(); pivot.rotation.y = phase; scene.add(pivot);
  const mesh = new THREE.Mesh(new THREE.SphereGeometry(radius, 48, 48),
    new THREE.MeshStandardMaterial({ map: makeTexture(colorFn, 512, 256, scale), roughness: 0.9 }));
  mesh.position.x = orbit; mesh.rotation.z = tilt; pivot.add(mesh);
  // orbit line
  const pts = []; for (let i = 0; i <= 128; i++) { const a = i / 128 * Math.PI * 2; pts.push(new THREE.Vector3(Math.cos(a) * orbit, 0, Math.sin(a) * orbit)); }
  scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineBasicMaterial({ color: 0x334466, transparent: true, opacity: 0.35 })));
  const p = { name, pivot, mesh, speed, spin, radius, orbit }; planets.push(p); return p;
}

addPlanet({ name: 'rock', radius: 1.2, orbit: 14, speed: 0.9, spin: 0.5, scale: 10, phase: 1,
  colorFn: (n) => mix([90, 80, 75], [180, 165, 150], n) });

const earth = addPlanet({ name: 'earth', radius: 2.2, orbit: 24, speed: 0.55, spin: 1.2, tilt: 0.4, scale: 5, phase: 3,
  colorFn: (n, lat) => {
    if (lat < 0.08 || lat > 0.92) return [235, 245, 255];
    if (n < 0.5) return mix([10, 40, 120], [30, 90, 180], n * 2);
    return mix([40, 130, 50], [150, 130, 80], (n - 0.5) * 2.5);
  } });
const moon = new THREE.Mesh(new THREE.SphereGeometry(0.55, 32, 32),
  new THREE.MeshStandardMaterial({ map: makeTexture((n) => mix([110, 110, 110], [200, 200, 195], n), 256, 128, 8), roughness: 1 }));
earth.mesh.add(moon);
const moonPivot = new THREE.Object3D(); earth.mesh.add(moonPivot); moonPivot.add(moon); moon.position.x = 4;
{ // atmosphere
  const atm = glowSprite('rgba(100,170,255,1)', 9, 0.5); earth.mesh.add(atm);
}

addPlanet({ name: 'mars', radius: 1.7, orbit: 34, speed: 0.4, spin: 1.1, tilt: 0.3, scale: 7, phase: 5,
  colorFn: (n, lat) => (lat < 0.06 || lat > 0.94) ? [240, 240, 245] : mix([130, 50, 25], [220, 130, 70], n) });

const giant = addPlanet({ name: 'jupiter', radius: 5, orbit: 52, speed: 0.22, spin: 0.8, tilt: 0.1, scale: 4, phase: 2,
  colorFn: (n, lat) => {
    const band = Math.sin(lat * 38 + n * 6) * 0.5 + 0.5;
    return mix([190, 140, 95], [235, 215, 180], band * 0.8 + n * 0.2);
  } });

const saturn = addPlanet({ name: 'saturn', radius: 4, orbit: 74, speed: 0.15, spin: 0.9, tilt: 0.45, scale: 4, phase: 4.2,
  colorFn: (n, lat) => mix([200, 175, 120], [240, 225, 170], (Math.sin(lat * 30 + n * 4) * 0.5 + 0.5)) });
{
  const rc = document.createElement('canvas'); rc.width = 512; rc.height = 1;
  const g = rc.getContext('2d');
  for (let x = 0; x < 512; x++) {
    const a = (0.35 + 0.65 * vnoise(x * 0.12, 0)) * (x < 40 || (x > 300 && x < 320) ? 0.1 : 1);
    g.fillStyle = `rgba(${210 + vnoise(x * .3, 1) * 40},${190 + vnoise(x * .3, 2) * 30},150,${a})`; g.fillRect(x, 0, 1, 1);
  }
  const geo = new THREE.RingGeometry(5.5, 10, 128);
  const p = geo.attributes.position, uv = geo.attributes.uv, v = new THREE.Vector3();
  for (let i = 0; i < p.count; i++) { v.fromBufferAttribute(p, i); uv.setXY(i, (v.length() - 5.5) / 4.5, 0.5); }
  const ring = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(rc), side: THREE.DoubleSide, transparent: true, depthWrite: false }));
  ring.rotation.x = Math.PI / 2; saturn.mesh.add(ring);
}

// ---------- asteroid belt ----------
const belt = new THREE.InstancedMesh(new THREE.IcosahedronGeometry(0.25, 0),
  new THREE.MeshStandardMaterial({ color: 0x8a8379, roughness: 1, flatShading: true }), 1800);
{
  const m = new THREE.Object3D();
  for (let i = 0; i < 1800; i++) {
    const a = Math.random() * Math.PI * 2, r = 40 + Math.random() * 7 + (Math.random() - .5) * 2;
    m.position.set(Math.cos(a) * r, (Math.random() - .5) * 2.2, Math.sin(a) * r);
    m.rotation.set(Math.random() * 6, Math.random() * 6, Math.random() * 6);
    m.scale.setScalar(0.4 + Math.random() * 1.6); m.updateMatrix(); belt.setMatrixAt(i, m.matrix);
  }
  scene.add(belt);
}

// ---------- spaceship ----------
const ship = new THREE.Group();
{
  const hull = new THREE.MeshStandardMaterial({ color: 0xcfd8e6, metalness: 0.8, roughness: 0.3 });
  const dark = new THREE.MeshStandardMaterial({ color: 0x3a4660, metalness: 0.7, roughness: 0.4 });
  // ship points toward +Z
  const body = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.5, 2.4, 16), hull); body.rotation.x = Math.PI / 2; ship.add(body);
  const nose = new THREE.Mesh(new THREE.ConeGeometry(0.35, 1.2, 16), dark); nose.rotation.x = Math.PI / 2; nose.position.z = 1.8; ship.add(nose);
  const cockpit = new THREE.Mesh(new THREE.SphereGeometry(0.3, 16, 12), new THREE.MeshStandardMaterial({ color: 0x66ccff, emissive: 0x2288cc, emissiveIntensity: 0.8 }));
  cockpit.scale.set(1, 0.7, 1.6); cockpit.position.set(0, 0.35, 0.5); ship.add(cockpit);
  for (const s of [-1, 1]) {
    const wing = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.07, 1.1), dark);
    wing.position.set(s * 1.1, -0.05, -0.5); wing.rotation.z = s * -0.08; wing.rotation.y = s * 0.35; ship.add(wing);
    const tip = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.45, 0.6), hull); tip.position.set(s * 1.9, 0.1, -0.85); ship.add(tip);
    const eng = glowSprite('rgba(90,190,255,1)', 1.6, 1); eng.position.set(s * 0.35, 0, -1.3); ship.add(eng);
    const nozzle = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.28, 0.4, 12), dark); nozzle.rotation.x = Math.PI / 2; nozzle.position.set(s * 0.35, 0, -1.2); ship.add(nozzle);
  }
  const lamp = new THREE.PointLight(0x66bbff, 6, 14); lamp.position.z = -1.6; ship.add(lamp);
  ship.scale.setScalar(1.1);
  scene.add(ship);
}

// flight path: weaves through the orbits, skimming the planets
const pathPts = [];
for (let i = 0; i < 16; i++) {
  const a = i / 16 * Math.PI * 2;
  const r = 38 + 30 * Math.sin(a * 2 + 0.7) * 0.8 + 10 * Math.cos(a * 3);
  pathPts.push(new THREE.Vector3(Math.cos(a) * r, 8 * Math.sin(a * 3) + 3 * Math.cos(a * 5), Math.sin(a) * r));
}
const path = new THREE.CatmullRomCurve3(pathPts, true, 'catmullrom', 0.5);
{
  const g = new THREE.BufferGeometry().setFromPoints(path.getPoints(400));
  scene.add(new THREE.Line(g, new THREE.LineDashedMaterial({ color: 0x3a7bd5, transparent: true, opacity: 0.0 })));
}

// engine trail
const TRAIL = 260, trailPos = new Float32Array(TRAIL * 3), trailCol = new Float32Array(TRAIL * 3);
const trailGeo = new THREE.BufferGeometry();
trailGeo.setAttribute('position', new THREE.BufferAttribute(trailPos, 3));
trailGeo.setAttribute('color', new THREE.BufferAttribute(trailCol, 3));
const trail = new THREE.Points(trailGeo, new THREE.PointsMaterial({
  size: 0.5, vertexColors: true, blending: THREE.AdditiveBlending, depthWrite: false, transparent: true }));
trail.frustumCulled = false; scene.add(trail);
let trailInit = false;

// ---------- camera modes ----------
let mode = 'free';
function setMode(m) {
  mode = m; controls.enabled = m === 'free';
  document.querySelectorAll('#ui button').forEach(b => b.classList.toggle('on', b.dataset.m === m));
}
document.querySelectorAll('#ui button').forEach(b => b.onclick = () => setMode(b.dataset.m));
addEventListener('keydown', e => { if (e.key === '1') setMode('free'); if (e.key === '2') setMode('chase'); if (e.key === '3') setMode('watch'); });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight);
});

// ---------- loop ----------
const clock = new THREE.Clock();
const tmpPos = new THREE.Vector3(), tmpTan = new THREE.Vector3(), tmpTarget = new THREE.Vector3();
const up = new THREE.Vector3(0, 1, 0), camGoal = new THREE.Vector3();
let u = 0, prevTan = new THREE.Vector3(1, 0, 0), bank = 0;

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;

  sun.rotation.y += dt * 0.05;
  sunGlow.material.opacity = 0.85 + Math.sin(t * 2) * 0.06;
  for (const p of planets) { p.pivot.rotation.y += dt * p.speed * 0.25; p.mesh.rotation.y += dt * p.spin * 0.5; }
  moonPivot.rotation.y += dt * 1.5;
  belt.rotation.y += dt * 0.02;

  // ship
  u = (u + dt * 0.012) % 1;
  path.getPointAt(u, tmpPos); path.getTangentAt(u, tmpTan);
  ship.position.copy(tmpPos);
  tmpTarget.copy(tmpPos).add(tmpTan); ship.lookAt(tmpTarget);
  const turn = prevTan.clone().cross(tmpTan).y; // banking from curvature
  bank += (THREE.MathUtils.clamp(turn * 900, -0.7, 0.7) - bank) * 0.05;
  ship.rotateZ(-bank); prevTan.copy(tmpTan);

  // trail (emit from behind the ship)
  const tail = tmpPos.clone().addScaledVector(tmpTan, -1.6);
  if (!trailInit) { for (let i = 0; i < TRAIL; i++) tail.toArray(trailPos, i * 3); trailInit = true; }
  trailPos.copyWithin(3, 0, (TRAIL - 1) * 3); tail.toArray(trailPos, 0);
  for (let i = 0; i < TRAIL; i++) {
    const f = 1 - i / TRAIL; trailCol[i * 3] = 0.3 * f * f; trailCol[i * 3 + 1] = 0.7 * f * f; trailCol[i * 3 + 2] = 1.0 * f * f;
  }
  trailGeo.attributes.position.needsUpdate = true; trailGeo.attributes.color.needsUpdate = true;

  if (mode === 'free') {
    controls.update();
  } else if (mode === 'chase') {
    camGoal.copy(tmpPos).addScaledVector(tmpTan, -9).addScaledVector(up, 3.2);
    camera.position.lerp(camGoal, 0.08);
    tmpTarget.copy(tmpPos).addScaledVector(tmpTan, 12); camera.lookAt(tmpTarget);
  } else { // watch from a vantage point near the sun-side, tracking the ship
    camGoal.set(0, 30, 0).add(new THREE.Vector3(Math.cos(t * 0.05) * 20, 0, Math.sin(t * 0.05) * 20));
    camera.position.lerp(camGoal, 0.03);
    camera.lookAt(tmpPos);
  }
  if (mode !== 'free') controls.target.copy(tmpPos);

  composer.render();
}
animate();
</script>
</body>
</html>
