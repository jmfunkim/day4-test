<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>제주 스카이 파이터</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; touch-action: none; user-select: none;
    font-family: system-ui, 'Malgun Gothic', sans-serif; color: #dff3ff; }
  canvas { display: block; }
  #hud { position: fixed; inset: 0; pointer-events: none; text-shadow: 0 1px 4px rgba(0,40,80,.9), 0 0 8px rgba(0,60,120,.6); }
  #score { position: absolute; top: 14px; left: 20px; font-size: 34px; font-weight: 700; letter-spacing: 2px; }
  #hi { position: absolute; top: 56px; left: 22px; font-size: 14px; opacity: .65; }
  #lives { position: absolute; top: 14px; right: 20px; font-size: 28px; letter-spacing: 4px; }
  #combo { position: absolute; top: 60px; right: 22px; font-size: 22px; color: #ffd24a; text-shadow: 0 0 10px #f90; }
  #power { position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%); font-size: 16px; color: #6ff; }
  #bossbar { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); width: 36%; display: none; text-align: center; font-size: 13px; color: #ff8080; }
  #bossbar div { height: 10px; border: 1px solid #f66; border-radius: 6px; overflow: hidden; margin-top: 4px; }
  #bossbar i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, #f33, #f90); }
  #flash { position: absolute; inset: 0; background: radial-gradient(transparent 40%, rgba(255,0,0,.7)); opacity: 0; transition: opacity .35s; }
  #msg { position: absolute; top: 30%; width: 100%; text-align: center; font-size: 40px; font-weight: 700; color: #fff;
    opacity: 0; transition: opacity .4s; text-shadow: 0 0 16px #f90; }
  .screen { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    background: rgba(8,40,70,.55); text-align: center; z-index: 5; }
  .screen h1 { margin: 0; font-size: 52px; letter-spacing: 4px; font-weight: 800; color: #ffb21a; text-shadow: 0 3px 0 #a34a00, 0 0 24px rgba(255,170,40,.8); }
  .screen p { margin: 0; opacity: .75; line-height: 1.7; }
  .screen button { background: #f08a10; color: #fff; border: 0; border-radius: 8px; padding: 14px 40px; font-size: 20px; cursor: pointer;
    box-shadow: 0 0 24px rgba(255,140,20,.7); margin-top: 10px; background: #f08a10; }
  .screen button:hover { transform: scale(1.05); }
  .hidden { display: none !important; }
  @media (max-width: 700px) {
    .screen { padding: 0 16px; box-sizing: border-box; }
    .screen h1 { font-size: 30px; }
    .screen p { font-size: 14px; }
    #score { font-size: 26px; top: 10px; left: 14px; } #hi { top: 42px; left: 16px; }
    #lives { font-size: 20px; top: 10px; right: 12px; letter-spacing: 2px; } #combo { font-size: 16px; top: 38px; right: 14px; }
    #bossbar { width: 60%; top: 52px; } #msg { font-size: 26px; } #power { font-size: 13px; bottom: 56px; }
    #tools a, #tools button { padding: 10px 12px; }
  }
  #tools { position: fixed; bottom: 10px; right: 10px; z-index: 6; display: flex; gap: 8px; }
  #tools a, #tools button { background: rgba(0,0,0,.45); color: #fff; border: 1px solid rgba(255,255,255,.35); border-radius: 8px;
    padding: 6px 10px; font-size: 13px; cursor: pointer; text-decoration: none; font-family: inherit; }
</style>
</head>
<body>
<div id="hud">
  <div id="score">0</div><div id="hi"></div>
  <div id="lives"></div><div id="combo"></div>
  <div id="bossbar">⚠ 돌하르방 대장<div><i></i></div></div>
  <div id="power"></div>
  <div id="msg"></div>
  <div id="flash"></div>
</div>

<div id="menu" class="screen">
  <h1>🍊 제주 스카이 파이터</h1>
  <p>감귤 비행기를 타고 제주 하늘을 날아라!<br>
     현무암 바위와 돌담을 뚫고, 까마귀 떼와 돌하르방 대장을 격추!<br>
     🖱 마우스 / WASD·방향키 &nbsp;·&nbsp; 📱 화면을 손가락으로 드래그해서 이동 &nbsp;·&nbsp; 자동 발사<br>
     🍊 감귤 = 점수 &nbsp; 🧡 한라봉 = 트리플샷 &nbsp; 🛡️ 천혜향 = 방어막 &nbsp; 🌺 동백꽃 = 생명<br>
     연속 격추로 콤보 배율 UP!</p>
  <button id="startBtn">게임 시작</button>
</div>
<div id="over" class="screen hidden">
  <h1>GAME OVER</h1>
  <p id="final"></p>
  <button id="retryBtn">다시 도전</button>
</div>
<div id="paused" class="screen hidden"><h1>PAUSED</h1><p>P / ESC / 화면 터치로 계속</p></div>

<div id="tools">
  <button id="pauseBtn">⏸</button>
  <button id="bSnd">🔊 소리</button>
  <a href="index.html">← 메인화면으로</a>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';

// ---------- 기본 세팅 ----------
const XR = 12, YR = 7;            // 플레이 영역 반폭/반높이
const SPAWN_Z = -200;
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x8fd3ff);
scene.fog = new THREE.Fog(0xb4e1f7, 90, 260);
const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.1, 600);
camera.position.set(0, 3, 10);

scene.add(new THREE.AmbientLight(0xe4f3ff, 1.5));
const sun = new THREE.DirectionalLight(0xfff0dd, 2.2);
sun.position.set(-30, 20, 15);
scene.add(sun);
const rim = new THREE.PointLight(0xffa040, 40, 40);
scene.add(rim);

// 제주 바다 (뒤로 흘러가는 물결)
const seaTex = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d'); g.fillStyle = '#1b8fc9'; g.fillRect(0, 0, 128, 128);
  g.strokeStyle = 'rgba(255,255,255,.35)'; g.lineWidth = 2;
  for (let y = 10; y < 128; y += 32) { g.beginPath(); for (let x = 0; x <= 128; x += 8) g.lineTo(x, y + Math.sin(x / 128 * Math.PI * 4 + y) * 4); g.stroke(); }
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(24, 40); t.colorSpace = THREE.SRGBColorSpace; return t;
})();
const sea = new THREE.Mesh(new THREE.PlaneGeometry(1200, 1200), new THREE.MeshStandardMaterial({ map: seaTex, roughness: .35, metalness: .1 }));
sea.rotation.x = -Math.PI / 2; sea.position.set(0, -18, -300); scene.add(sea);

// 한라산 + 백록담, 성산일출봉 (멀리 배경)
const hallasan = new THREE.Mesh(new THREE.CylinderGeometry(22, 190, 85, 40, 1),
  new THREE.MeshStandardMaterial({ color: 0x5f93a8, roughness: 1, flatShading: true, fog: false }));
hallasan.position.set(-110, -18 + 42, -430); scene.add(hallasan);
const lake = new THREE.Mesh(new THREE.CircleGeometry(9, 24).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ color: 0x4fb4e8, fog: false }));
lake.position.set(-110, -18 + 85.3, -430); scene.add(lake);
const seongsan = new THREE.Mesh(new THREE.CylinderGeometry(28, 70, 34, 24, 1),
  new THREE.MeshStandardMaterial({ color: 0x6aa28a, roughness: 1, flatShading: true, fog: false }));
seongsan.position.set(150, -18 + 17, -380); scene.add(seongsan);
const sunSprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTexture(), color: 0xfff2b0, blending: THREE.AdditiveBlending, transparent: true, depthWrite: false, fog: false }));
sunSprite.scale.set(160, 160, 1); sunSprite.position.set(90, 70, -470); scene.add(sunSprite);

// 구름
const SN = 500;
const starPos = new Float32Array(SN * 3);
for (let i = 0; i < SN; i++) {
  starPos[i*3] = (Math.random() - .5) * 260;
  starPos[i*3+1] = (Math.random() - .5) * 160;
  starPos[i*3+2] = -320 + Math.random() * 340;
}
const starGeo = new THREE.BufferGeometry();
starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 6, map: glowTexture(), transparent: true, opacity: .5, depthWrite: false, sizeAttenuation: true, fog: false }));
stars.frustumCulled = false;
scene.add(stars);

// ---------- 파티클 ----------
function glowTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const g = c.getContext('2d'), gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, '#fff'); gr.addColorStop(.35, 'rgba(255,255,255,.6)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
  return new THREE.CanvasTexture(c);
}
const PN = 3000;
const pPos = new Float32Array(PN * 3), pCol = new Float32Array(PN * 3), pBase = new Float32Array(PN * 3);
const pVel = new Float32Array(PN * 3), pLife = new Float32Array(PN), pMax = new Float32Array(PN);
const pGeo = new THREE.BufferGeometry();
pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
pGeo.setAttribute('color', new THREE.BufferAttribute(pCol, 3));
const particles = new THREE.Points(pGeo, new THREE.PointsMaterial({
  size: .8, map: glowTexture(), vertexColors: true, blending: THREE.AdditiveBlending, depthWrite: false, transparent: true, fog: false }));
particles.frustumCulled = false;
scene.add(particles);
let pIdx = 0;
function emit(x, y, z, vx, vy, vz, r, g, b, life) {
  const i = pIdx; pIdx = (pIdx + 1) % PN;
  pPos[i*3] = x; pPos[i*3+1] = y; pPos[i*3+2] = z;
  pVel[i*3] = vx; pVel[i*3+1] = vy; pVel[i*3+2] = vz;
  pBase[i*3] = r; pBase[i*3+1] = g; pBase[i*3+2] = b;
  pLife[i] = pMax[i] = life;
}
function burst(p, color, n, speed) {
  const c = new THREE.Color(color);
  for (let i = 0; i < n; i++) {
    const d = new THREE.Vector3(Math.random() - .5, Math.random() - .5, Math.random() - .5).normalize().multiplyScalar(speed * (.3 + Math.random()));
    emit(p.x, p.y, p.z, d.x, d.y, d.z, c.r, c.g, c.b, .5 + Math.random() * .6);
  }
}
function updateParticles(dt) {
  for (let i = 0; i < PN; i++) {
    if (pLife[i] > 0) {
      pLife[i] -= dt;
      pPos[i*3] += pVel[i*3] * dt; pPos[i*3+1] += pVel[i*3+1] * dt; pPos[i*3+2] += (pVel[i*3+2] + world.speed * .7) * dt;
      const f = Math.max(pLife[i] / pMax[i], 0);
      pCol[i*3] = pBase[i*3] * f; pCol[i*3+1] = pBase[i*3+1] * f; pCol[i*3+2] = pBase[i*3+2] * f;
    } else { pCol[i*3] = pCol[i*3+1] = pCol[i*3+2] = 0; }
  }
  pGeo.attributes.position.needsUpdate = true;
  pGeo.attributes.color.needsUpdate = true;
}

// ---------- 소리 ----------
let ac = null, muted = false;
function initAudio() { if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } if (ac && ac.state === 'suspended') ac.resume(); }
function beep(freq, dur, type = 'square', vol = .04, slide = 0) {
  if (!ac || muted) return;
  const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
  o.connect(g).connect(ac.destination); o.start(t); o.stop(t + dur);
}
function boom(vol = .15, dur = .45) {
  if (!ac || muted) return;
  const n = ac.sampleRate * dur, buf = ac.createBuffer(1, n, ac.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2);
  const s = ac.createBufferSource(), g = ac.createGain(), f = ac.createBiquadFilter();
  f.type = 'lowpass'; f.frequency.value = 900; g.gain.value = vol;
  s.buffer = buf; s.connect(f).connect(g).connect(ac.destination); s.start();
}
const sfx = {
  shoot: () => beep(880, .07, 'square', .018, -500),
  hit: () => beep(220, .08, 'sawtooth', .03, -100),
  boom: () => boom(.14, .4),
  bigboom: () => boom(.3, 1),
  coin: () => { beep(988, .08, 'triangle', .06); setTimeout(() => beep(1319, .12, 'triangle', .06), 70); },
  power: () => { beep(400, .25, 'sine', .08, 800); },
  hurt: () => { boom(.3, .6); beep(120, .4, 'sawtooth', .1, -80); },
};

// ---------- 모델 ----------
const mk = (c, o = {}) => new THREE.MeshStandardMaterial({ color: c, roughness: .45, metalness: .5, ...o });
function buildShip() {
  const g = new THREE.Group();
  // 감귤 비행기: 오렌지색 동체 + 잎사귀 꼬리날개 + 프로펠러
  const body = new THREE.Mesh(new THREE.SphereGeometry(.85, 20, 14), mk(0xff9a1f, { metalness: .1, roughness: .4 }));
  body.scale.set(1, .85, 1.55); g.add(body);
  const wing = new THREE.Mesh(new THREE.BoxGeometry(3.4, .09, .95), mk(0xfff0c0, { metalness: .1 }));
  wing.position.z = .15; g.add(wing);
  for (const s of [-1, 1]) {
    const fin = new THREE.Mesh(new THREE.BoxGeometry(.08, .5, .6), mk(0x2fa84a, { metalness: .1 }));
    fin.position.set(s * 1.6, .25, .35); g.add(fin);
    const tip = new THREE.Mesh(new THREE.SphereGeometry(.09, 8, 8), new THREE.MeshBasicMaterial({ color: s < 0 ? 0xff3030 : 0x30ff60 }));
    tip.position.set(s * 1.7, 0, .15); g.add(tip);
  }
  const tail = new THREE.Mesh(new THREE.SphereGeometry(.5, 12, 8), mk(0x38b24d, { metalness: .1 }));
  tail.scale.set(.12, 1, 1.1); tail.position.set(0, .75, 1.05); tail.rotation.x = -.35; g.add(tail);
  const stem = new THREE.Mesh(new THREE.CylinderGeometry(.06, .08, .35, 6), mk(0x6b4a1a, { metalness: 0 }));
  stem.position.set(0, .88, -.3); g.add(stem);
  const cockpit = new THREE.Mesh(new THREE.SphereGeometry(.38, 14, 10), mk(0x9fe3ff, { emissive: 0x2a9fe0, emissiveIntensity: .5, transparent: true, opacity: .85 }));
  cockpit.position.set(0, .4, -.45); cockpit.scale.set(1, .8, 1.3); g.add(cockpit);
  for (const s of [-1, 1]) { const eye = new THREE.Mesh(new THREE.SphereGeometry(.09, 8, 6), new THREE.MeshBasicMaterial({ color: 0x2a1200 })); eye.position.set(s * .28, .38, -.95); g.add(eye); }
  const prop = new THREE.Mesh(new THREE.BoxGeometry(1.7, .1, .06), mk(0xdddddd)); prop.position.z = -1.35; g.add(prop); g.userData.prop = prop;
  const glow = new THREE.Mesh(new THREE.SphereGeometry(.3, 10, 8), new THREE.MeshBasicMaterial({ color: 0xffd060 }));
  glow.position.z = 1.45; g.add(glow);
  g.userData.glow = glow;
  const shield = new THREE.Mesh(new THREE.SphereGeometry(2, 20, 14),
    new THREE.MeshBasicMaterial({ color: 0x7fe3ff, transparent: true, opacity: .3, wireframe: true }));
  shield.visible = false; g.add(shield); g.userData.shield = shield;
  return g;
}
const ship = buildShip();
scene.add(ship);

const rockGeos = [0, 1, 2].map(() => {
  const g = new THREE.IcosahedronGeometry(1, 1), p = g.attributes.position;
  for (let i = 0; i < p.count; i++) { const k = .75 + Math.random() * .5; p.setXYZ(i, p.getX(i) * k, p.getY(i) * k, p.getZ(i) * k); }
  g.computeVertexNormals(); return g;
});
const rockMats = [0x2d2b2e, 0x3b3836, 0x4a4540].map(c => new THREE.MeshStandardMaterial({ color: c, flatShading: true, roughness: 1, metalness: 0 }));
const bulletGeo = new THREE.SphereGeometry(.2, 8, 6).scale(1, 1, 2.6);   // 귤씨 총알
const bulletMat = new THREE.MeshBasicMaterial({ color: 0xffa020 });
const ebGeo = new THREE.SphereGeometry(.4, 10, 8);
const ebMat = new THREE.MeshBasicMaterial({ color: 0xcc2255 });
const coinGeo = new THREE.SphereGeometry(.6, 14, 10);                    // 감귤
const coinMat = new THREE.MeshStandardMaterial({ color: 0xff9a1f, emissive: 0xcc5a00, emissiveIntensity: .6, metalness: 0, roughness: .5 });
const powGeos = { triple: new THREE.SphereGeometry(.85, 14, 10), shield: new THREE.SphereGeometry(.75, 14, 10), heart: new THREE.IcosahedronGeometry(.7, 0) };
const powMats = {
  triple: new THREE.MeshStandardMaterial({ color: 0xffc21a, emissive: 0xcc8000, emissiveIntensity: 1, metalness: 0 }),   // 한라봉
  shield: new THREE.MeshStandardMaterial({ color: 0x7fe3ff, emissive: 0x2a8ac0, emissiveIntensity: 1, metalness: 0 }),   // 천혜향
  heart: new THREE.MeshStandardMaterial({ color: 0xe01848, emissive: 0xa00830, emissiveIntensity: 1, metalness: 0 }),    // 동백꽃
};
function buildEnemy() {   // 까마귀
  const g = new THREE.Group();
  const b = new THREE.Mesh(new THREE.SphereGeometry(.7, 12, 8), mk(0x22222a, { metalness: .1 })); b.scale.set(1, .8, 1.5); g.add(b);
  for (const s of [-1, 1]) { const w = new THREE.Mesh(new THREE.BoxGeometry(1.6, .08, .9), mk(0x15151a, { metalness: .1 })); w.position.set(s * 1.2, .1, 0); w.rotation.z = s * .25; g.add(w); }
  const beak = new THREE.Mesh(new THREE.ConeGeometry(.2, .7, 6), mk(0xffb020, { metalness: 0 })); beak.rotation.x = Math.PI / 2; beak.position.z = 1.2; g.add(beak);
  for (const s of [-1, 1]) { const e = new THREE.Mesh(new THREE.SphereGeometry(.12, 8, 8), new THREE.MeshBasicMaterial({ color: 0xff3030 })); e.position.set(s * .28, .2, .85); g.add(e); }
  return g;
}
function buildBoss() {    // 돌하르방 대장
  const g = new THREE.Group();
  const stone = mk(0x77736b, { flatShading: true, metalness: 0, roughness: 1 });
  const dark = mk(0x4a4743, { flatShading: true, metalness: 0, roughness: 1 });
  const core = new THREE.Object3D(); g.add(core);
  const head = new THREE.Mesh(new THREE.SphereGeometry(3.2, 16, 12), stone); head.scale.set(1, 1.1, 1); g.add(head);
  const brim = new THREE.Mesh(new THREE.CylinderGeometry(4.8, 4.8, .55, 24), dark); brim.position.y = 3.1; g.add(brim);
  const hat = new THREE.Mesh(new THREE.CylinderGeometry(2.4, 3.2, 2.2, 20), dark); hat.position.y = 4.3; g.add(hat);
  const nose = new THREE.Mesh(new THREE.BoxGeometry(1, 1.9, 1.3), stone); nose.position.set(0, -.3, 3.1); g.add(nose);
  const mouth = new THREE.Mesh(new THREE.BoxGeometry(2, .3, .4), dark); mouth.position.set(0, -1.9, 2.9); g.add(mouth);
  const eye = new THREE.Group();
  for (const s of [-1, 1]) { const e = new THREE.Mesh(new THREE.SphereGeometry(.7, 12, 10), new THREE.MeshBasicMaterial({ color: 0xffb020 })); e.position.set(s * 1.35, .9, 2.8); eye.add(e); }
  g.add(eye);
  // 주위를 도는 현무암 / 귤 고리
  const knot = new THREE.Group(), knot2 = new THREE.Group();
  for (let i = 0; i < 8; i++) { const r = new THREE.Mesh(rockGeos[i % 3], rockMats[i % 3]); const a = i / 8 * Math.PI * 2; r.position.set(Math.cos(a) * 6.5, Math.sin(a) * 6.5, 0); r.scale.setScalar(.9); knot.add(r); }
  for (let i = 0; i < 10; i++) { const r = new THREE.Mesh(coinGeo, coinMat); const a = i / 10 * Math.PI * 2; r.position.set(Math.cos(a) * 8, 0, Math.sin(a) * 8); knot2.add(r); }
  g.add(knot, knot2);
  g.userData = { core, knot, knot2, eye };
  return g;
}

// ---------- 게임 상태 ----------
const world = { speed: 40 };
const G = {
  mode: 'menu', t: 0, score: 0, lives: 3, combo: 1, comboT: 0, hi: (() => { try { return +localStorage.getItem('jeju_skyfighter_hi') || 0; } catch (e) { return 0; } })(),
  invuln: 0, tripleT: 0, shield: false, fireT: 0, spawnT: 1, wallT: 14, enemyT: 4, shake: 0,
  nextBossAt: 50, boss: null, bossFireT: 0, bossRingT: 0, bossCount: 0,
};
const target = new THREE.Vector2(0, 0);
const rocks = [], enemies = [], coins = [], powers = [], bullets = [], ebullets = [];

const $ = id => document.getElementById(id);
const hud = { score: $('score'), hi: $('hi'), lives: $('lives'), combo: $('combo'), power: $('power'), flash: $('flash'),
  msg: $('msg'), bossbar: $('bossbar'), bossfill: $('bossbar').querySelector('i') };

function remove(arr, i) { scene.remove(arr[i].mesh); arr[i] = arr[arr.length - 1]; arr.pop(); }
function clearAll() { for (const a of [rocks, enemies, coins, powers, bullets, ebullets]) while (a.length) remove(a, a.length - 1); }
const rnd = (a, b) => a + Math.random() * (b - a);
let msgTimer = 0;
function say(text, ms = 1600) {
  hud.msg.textContent = text; hud.msg.style.opacity = 1; clearTimeout(msgTimer);
  msgTimer = setTimeout(() => hud.msg.style.opacity = 0, ms);
}
function updateHud() {
  hud.score.textContent = G.score.toLocaleString();
  hud.hi.textContent = 'BEST ' + Math.max(G.hi, G.score).toLocaleString();
  hud.lives.textContent = '🍊'.repeat(Math.max(G.lives, 0));
  hud.combo.textContent = G.combo > 1 ? `COMBO ×${G.combo}` : '';
  const p = [];
  if (G.tripleT > 0) p.push(`🧡 한라봉 트리플샷 ${G.tripleT.toFixed(1)}s`);
  if (G.shield) p.push('🛡️ 천혜향 방어막');
  hud.power.textContent = p.join('   ');
}
function addScore(n) { G.score += n * G.combo; }
function killCombo() { G.combo = 1; G.comboT = 0; }
function bumpCombo() { G.combo = Math.min(G.combo + 1, 8); G.comboT = 3; }

// ---------- 스폰 ----------
function spawnRock(x, y, s, z = SPAWN_Z) {
  s = s ?? rnd(.8, 3.2);
  const m = new THREE.Mesh(rockGeos[(Math.random() * 3) | 0], rockMats[(Math.random() * 3) | 0]);
  m.scale.setScalar(s); m.position.set(x ?? rnd(-XR - 3, XR + 3), y ?? rnd(-YR - 2, YR + 2), z);
  m.rotation.set(Math.random() * 6, Math.random() * 6, 0); scene.add(m);
  rocks.push({ mesh: m, r: s * .95, hp: Math.ceil(s / 1.1), max: Math.ceil(s / 1.1), s,
    vx: rnd(-1.5, 1.5), vy: rnd(-1, 1), rx: rnd(-1, 1), ry: rnd(-1, 1) });
}
function spawnWall() {
  const gx = rnd(-XR + 3, XR - 3), gy = rnd(-YR + 2, YR - 2);
  for (let x = -XR - 3; x <= XR + 3; x += 3.2)
    for (let y = -YR - 3; y <= YR + 3; y += 3.2)
      if (Math.abs(x - gx) > 3.4 || Math.abs(y - gy) > 3.4) spawnRock(x, y, 1.7);
  for (const r of rocks) if (r.mesh.position.z === SPAWN_Z && r.s === 1.7) { r.vx = r.vy = 0; }
  say('⚠ 현무암 돌담!', 1200);
}
function spawnEnemy() {
  const m = buildEnemy(); m.position.set(rnd(-XR, XR), rnd(-YR + 1, YR - 1), SPAWN_Z); scene.add(m);
  enemies.push({ mesh: m, r: 1.3, hp: 2, ph: Math.random() * 6, bx: m.position.x, by: m.position.y, fire: rnd(1.2, 2.5) });
}
function spawnCoin() {
  const m = new THREE.Mesh(coinGeo, coinMat); m.position.set(rnd(-XR, XR), rnd(-YR, YR), SPAWN_Z); scene.add(m);
  coins.push({ mesh: m, r: 1.1 });
  // 코인 줄
  const dx = rnd(-.5, .5), dy = rnd(-.4, .4);
  for (let i = 1; i < 5; i++) {
    const c = new THREE.Mesh(coinGeo, coinMat);
    c.position.set(THREE.MathUtils.clamp(m.position.x + dx * i * 2, -XR, XR), THREE.MathUtils.clamp(m.position.y + dy * i * 2, -YR, YR), SPAWN_Z - i * 5);
    scene.add(c); coins.push({ mesh: c, r: 1.1 });
  }
}
function spawnPower() {
  const kinds = G.lives < 5 ? ['triple', 'shield', 'heart'] : ['triple', 'shield'];
  const k = kinds[(Math.random() * kinds.length) | 0];
  const m = new THREE.Mesh(powGeos[k], powMats[k]); m.position.set(rnd(-XR, XR), rnd(-YR, YR), SPAWN_Z); scene.add(m);
  powers.push({ mesh: m, r: 1.3, kind: k });
}
function spawnBoss() {
  const m = buildBoss(); m.position.set(0, 0, SPAWN_Z); scene.add(m);
  G.bossCount++;
  const hp = 50 + G.bossCount * 20;
  G.boss = { mesh: m, r: 5.5, hp, max: hp, bossT: 0 };
  G.bossFireT = 2; G.bossRingT = 5;
  hud.bossbar.style.display = 'block'; hud.bossfill.style.width = '100%';
  say('⚠ 돌하르방 대장 등장!', 2200);
}

// ---------- 전투 ----------
function fire() {
  const p = ship.position;
  const shots = G.tripleT > 0 ? [-9, 0, 9] : [0];
  for (const vx of shots) {
    const m = new THREE.Mesh(bulletGeo, bulletMat); m.position.set(p.x + vx * .05, p.y, p.z - 1.5); scene.add(m);
    bullets.push({ mesh: m, vx });
  }
  sfx.shoot();
}
function ebullet(from, dir, speed) {
  const m = new THREE.Mesh(ebGeo, ebMat); m.position.copy(from); scene.add(m);
  ebullets.push({ mesh: m, vel: dir.clone().normalize().multiplyScalar(speed), r: .5 });
}
function hurtPlayer() {
  if (G.invuln > 0 || G.mode !== 'play') return;
  if (G.shield) { G.shield = false; G.invuln = 1; burst(ship.position, 0x40ffa0, 40, 14); sfx.power(); return; }
  G.lives--; G.invuln = 2; G.shake = 1; killCombo();
  burst(ship.position, 0xff6030, 60, 16); sfx.hurt();
  hud.flash.style.transition = 'none'; hud.flash.style.opacity = 1;
  requestAnimationFrame(() => { hud.flash.style.transition = 'opacity .5s'; hud.flash.style.opacity = 0; });
  if (G.lives <= 0) gameOver();
}
function destroyRock(i) {
  const r = rocks[i];
  burst(r.mesh.position, 0xffaa66, 12 + (r.s * 6 | 0), 10 + r.s * 2); sfx.boom();
  addScore(Math.round(10 * r.s)); bumpCombo();
  if (r.s > 2) for (let k = 0; k < 2; k++) {   // 큰 바위는 쪼개짐
    const p = r.mesh.position; spawnRock(p.x + rnd(-1, 1), p.y + rnd(-1, 1), r.s * .5, p.z);
    const n = rocks[rocks.length - 1]; n.vx = rnd(-6, 6); n.vy = rnd(-5, 5);
  }
  remove(rocks, i);
}
function killEnemy(i) {
  burst(enemies[i].mesh.position, 0xff4040, 30, 16); sfx.boom(); addScore(100); bumpCombo();
  if (Math.random() < .25) { const m = new THREE.Mesh(coinGeo, coinMat); m.position.copy(enemies[i].mesh.position); scene.add(m); coins.push({ mesh: m, r: 1.1 }); }
  remove(enemies, i);
}
function killBoss() {
  const b = G.boss;
  for (let k = 0; k < 8; k++) setTimeout(() => burst(b.mesh.position.clone().add(new THREE.Vector3(rnd(-4, 4), rnd(-4, 4), rnd(-2, 2))), k % 2 ? 0xffaa40 : 0xff4030, 70, 26), k * 120);
  sfx.bigboom(); addScore(2000); G.shake = 1.2;
  scene.remove(b.mesh); G.boss = null; hud.bossbar.style.display = 'none';
  G.nextBossAt = G.t + 55; G.lives = Math.min(5, G.lives + 1);
  say('★ 돌하르방 대장 격파! +2000 ★', 2400);
  for (let i = 0; i < ebullets.length; i++) { burst(ebullets[i].mesh.position, 0xff6060, 4, 6); }
  while (ebullets.length) remove(ebullets, ebullets.length - 1);
}

// ---------- 메인 업데이트 ----------
function update(dt) {
  G.t += dt;
  world.speed = Math.min(40 + G.t * .45, 95);
  const S = world.speed;

  // 플레이어 이동
  if (keys.has('arrowleft') || keys.has('a')) target.x -= 22 * dt;
  if (keys.has('arrowright') || keys.has('d')) target.x += 22 * dt;
  if (keys.has('arrowup') || keys.has('w')) target.y += 16 * dt;
  if (keys.has('arrowdown') || keys.has('s')) target.y -= 16 * dt;
  target.x = THREE.MathUtils.clamp(target.x, -XR, XR); target.y = THREE.MathUtils.clamp(target.y, -YR, YR);
  const k = 1 - Math.exp(-12 * dt), px = ship.position.x, py = ship.position.y;
  ship.position.x += (target.x - px) * k; ship.position.y += (target.y - py) * k;
  const vx = (ship.position.x - px) / dt, vy = (ship.position.y - py) / dt;
  ship.rotation.z = THREE.MathUtils.lerp(ship.rotation.z, THREE.MathUtils.clamp(-vx * .045, -.9, .9), .2);
  ship.rotation.x = THREE.MathUtils.lerp(ship.rotation.x, THREE.MathUtils.clamp(vy * .02, -.4, .4), .2);
  G.invuln = Math.max(0, G.invuln - dt);
  ship.visible = G.invuln <= 0 || Math.floor(G.invuln * 14) % 2 === 0;
  ship.userData.shield.visible = G.shield; ship.userData.shield.rotation.y += dt * 2;
  ship.userData.glow.scale.setScalar(1 + Math.random() * .4);
  rim.position.set(ship.position.x, ship.position.y, ship.position.z + 4);
  // 엔진 불꽃
  for (let i = 0; i < 2; i++) emit(ship.position.x + rnd(-.15, .15), ship.position.y + rnd(-.15, .15), 1.5, rnd(-1, 1), rnd(-1, 1), 8, .5, .22 + Math.random() * .15, .02, .16);

  // 발사
  G.fireT -= dt;
  if (G.fireT <= 0) { fire(); G.fireT = .14; }
  G.tripleT = Math.max(0, G.tripleT - dt);

  // 콤보 타이머
  if (G.combo > 1) { G.comboT -= dt; if (G.comboT <= 0) killCombo(); }

  // 스폰
  const bossOn = !!G.boss;
  G.spawnT -= dt;
  if (G.spawnT <= 0) {
    G.spawnT = Math.max(.22, .85 - G.t * .006) * (bossOn ? 2.2 : 1);
    const r = Math.random();
    if (r < .72 || bossOn) spawnRock();
    else if (r < .86) spawnCoin();
    else if (r < .93) spawnPower();
    else spawnRock(ship.position.x, ship.position.y, rnd(1, 2));   // 조준 바위
  }
  if (!bossOn) {
    G.wallT -= dt; if (G.wallT <= 0) { G.wallT = rnd(14, 22); if (G.t > 15) spawnWall(); }
    G.enemyT -= dt; if (G.enemyT <= 0 && G.t > 8) { G.enemyT = Math.max(1.4, 4 - G.t * .03); const n = 1 + (Math.random() < .35); for (let i = 0; i < n; i++) spawnEnemy(); }
    if (G.t >= G.nextBossAt) spawnBoss();
  }

  // 바위
  for (let i = rocks.length - 1; i >= 0; i--) {
    const r = rocks[i], m = r.mesh;
    m.position.z += S * dt; m.position.x += r.vx * dt; m.position.y += r.vy * dt;
    m.rotation.x += r.rx * dt; m.rotation.y += r.ry * dt;
    if (m.position.z > 14) { remove(rocks, i); continue; }
    if (Math.abs(m.position.z) < r.r + .8 && m.position.distanceTo(ship.position) < r.r + .9) {
      hurtPlayer(); if (G.invuln > 0) { burst(m.position, 0xffaa66, 20, 12); remove(rocks, i); }
    }
  }
  // 적
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i], m = e.mesh;
    e.ph += dt * 2;
    m.position.z += S * .55 * dt;
    m.position.x = e.bx + Math.sin(e.ph) * 5; m.position.y = e.by + Math.cos(e.ph * .7) * 2;
    m.rotation.z = Math.cos(e.ph) * .6;
    if (m.position.z > -90 && m.position.z < -10) {
      e.fire -= dt;
      if (e.fire <= 0) { e.fire = rnd(1.3, 2.2); ebullet(m.position, ship.position.clone().sub(m.position), 38); }
    }
    if (m.position.z > 14) { remove(enemies, i); continue; }
    if (m.position.distanceTo(ship.position) < e.r + .9) { burst(m.position, 0xff4040, 20, 12); hurtPlayer(); remove(enemies, i); }
  }
  // 코인 / 파워업
  for (let i = coins.length - 1; i >= 0; i--) {
    const c = coins[i], m = c.mesh; m.position.z += S * dt; m.rotation.y += dt * 4;
    const d = m.position.distanceTo(ship.position);
    if (d < 5 && m.position.z > -20) m.position.lerp(ship.position, dt * 5);   // 자석
    if (d < c.r + .9) { addScore(50); sfx.coin(); burst(m.position, 0xffd24a, 8, 6); remove(coins, i); }
    else if (m.position.z > 14) remove(coins, i);
  }
  for (let i = powers.length - 1; i >= 0; i--) {
    const p = powers[i], m = p.mesh; m.position.z += S * dt; m.rotation.x += dt * 2; m.rotation.y += dt * 3;
    if (m.position.distanceTo(ship.position) < p.r + .9) {
      sfx.power(); burst(m.position, 0xffffff, 30, 10);
      if (p.kind === 'triple') { G.tripleT = 10; say('🧡 한라봉 트리플샷!', 1000); }
      else if (p.kind === 'shield') { G.shield = true; say('🛡️ 천혜향 방어막!', 1000); }
      else { G.lives = Math.min(5, G.lives + 1); say('🌺 동백꽃 생명 +1', 1000); }
      remove(powers, i);
    } else if (m.position.z > 14) remove(powers, i);
  }
  // 총알
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i], m = b.mesh;
    m.position.z -= 150 * dt; m.position.x += b.vx * dt;
    let used = false;
    for (let j = rocks.length - 1; j >= 0 && !used; j--) {
      const r = rocks[j];
      if (m.position.distanceTo(r.mesh.position) < r.r + .3) {
        used = true; r.hp--; sfx.hit(); burst(m.position, 0xffcc88, 3, 6);
        r.mesh.scale.setScalar(r.s * 1.08);
        if (r.hp <= 0) destroyRock(j);
      }
    }
    for (let j = enemies.length - 1; j >= 0 && !used; j--) {
      const e = enemies[j];
      if (m.position.distanceTo(e.mesh.position) < e.r + .4) {
        used = true; e.hp--; sfx.hit(); burst(m.position, 0xff8888, 4, 8);
        if (e.hp <= 0) killEnemy(j);
      }
    }
    if (!used && G.boss && m.position.distanceTo(G.boss.mesh.position) < G.boss.r) {
      used = true; G.boss.hp--; sfx.hit(); burst(m.position, 0xffcc66, 3, 10);
      hud.bossfill.style.width = Math.max(0, G.boss.hp / G.boss.max * 100) + '%';
      if (G.boss.hp <= 0) killBoss();
    }
    if (used || m.position.z < -230) remove(bullets, i);
  }
  // 적 탄환
  for (let i = ebullets.length - 1; i >= 0; i--) {
    const b = ebullets[i], m = b.mesh;
    m.position.addScaledVector(b.vel, dt);
    m.scale.setScalar(1 + Math.sin(G.t * 20 + i) * .15);
    if (m.position.z > 12 || Math.abs(m.position.x) > 60 || Math.abs(m.position.y) > 40) { remove(ebullets, i); continue; }
    if (m.position.distanceTo(ship.position) < b.r + .8) { remove(ebullets, i); hurtPlayer(); }
  }
  // 보스
  if (G.boss) {
    const b = G.boss, m = b.mesh, u = m.userData;
    b.bossT += dt;
    if (m.position.z < -65) m.position.z += Math.min(60 * dt, -65 - m.position.z + 0.01);
    else {
      m.position.x = Math.sin(b.bossT * .8) * 10; m.position.y = Math.cos(b.bossT * .55) * 4;
      G.bossFireT -= dt; G.bossRingT -= dt;
      if (G.bossFireT <= 0) {
        G.bossFireT = Math.max(.7, 1.4 - G.bossCount * .1);
        for (let a = -2; a <= 2; a++) {
          const d = ship.position.clone().sub(m.position); d.x += a * 4; ebullet(m.position, d, 42);
        }
      }
      if (G.bossRingT <= 0) {
        G.bossRingT = 4.5;
        for (let a = 0; a < 16; a++) {
          const an = a / 16 * Math.PI * 2; ebullet(m.position, new THREE.Vector3(Math.cos(an) * .5, Math.sin(an) * .5, 1), 30);
        }
      }
    }
    u.core.rotation.y += dt * .8; u.knot.rotation.x += dt * 1.2; u.knot2.rotation.y += dt * 1.6;
    u.eye.scale.setScalar(1 + Math.sin(G.t * 6) * .15);
    if (m.position.z > -20 && m.position.distanceTo(ship.position) < b.r + 1) hurtPlayer();
  }

  // 별 이동
  for (let i = 0; i < SN; i++) {
    starPos[i*3+2] += S * dt * .9;
    if (starPos[i*3+2] > 20) { starPos[i*3+2] = -320; starPos[i*3] = (Math.random() - .5) * 260; starPos[i*3+1] = (Math.random() - .5) * 160; }
  }
  starGeo.attributes.position.needsUpdate = true;
  seaTex.offset.y += S * dt * .04;
  ship.userData.prop.rotation.z += dt * 40;

  // 점수 보너스: 시간 생존
  G.score += Math.round(dt * 10 * 0) ; // (생존 점수는 없음, 격추/코인 중심)
  updateHud();
}

function updateCamera(dt) {
  const p = ship.position;
  camera.position.x += (p.x * .45 - camera.position.x) * Math.min(1, dt * 6);
  camera.position.y += (p.y * .45 + 2.8 - camera.position.y) * Math.min(1, dt * 6);
  camera.position.z = 10;
  G.shake = Math.max(0, G.shake - dt * 2.5);
  camera.position.x += rnd(-1, 1) * G.shake * .6; camera.position.y += rnd(-1, 1) * G.shake * .6;
  camera.lookAt(p.x * .3, p.y * .3, -25);
  let fov = 68 + (world.speed - 40) * .15;
  const aspect = innerWidth / innerHeight;
  if (aspect < 1.3) fov = Math.min(100, 2 * Math.atan(Math.tan(fov * Math.PI / 360) * 1.3 / aspect) * 180 / Math.PI);   // 세로 화면: 시야 확대
  view.reachX = Math.min(XR, Math.tan(fov * Math.PI / 360) * aspect * 10 * .85);
  if (Math.abs(camera.fov - fov) > .05) { camera.fov = fov; camera.updateProjectionMatrix(); }
}

// ---------- 흐름 ----------
function startGame() {
  initAudio(); clearAll();
  if (G.boss) { scene.remove(G.boss.mesh); G.boss = null; }          // 이전 판의 보스
  pLife.fill(0); pCol.fill(0); pGeo.attributes.color.needsUpdate = true; // 남은 파티클
  ship.visible = true; ship.rotation.set(0, 0, 0);
  hud.msg.style.opacity = 0; hud.flash.style.opacity = 0;
  Object.assign(G, { mode: 'play', t: 0, score: 0, lives: 3, combo: 1, comboT: 0, invuln: 1.5, tripleT: 0, shield: false, fireT: 0,
    spawnT: 1, wallT: 14, enemyT: 4, shake: 0, nextBossAt: 50, boss: null, bossCount: 0 });
  hud.bossbar.style.display = 'none';
  target.set(0, 0); ship.position.set(0, 0, 0);
  for (const id of ['menu', 'over', 'paused']) $(id).classList.add('hidden');
  say('GO!', 900); updateHud();
}
function gameOver() {
  G.mode = 'over'; sfx.bigboom();
  burst(ship.position, 0x66aaff, 120, 22); ship.visible = false;
  const isBest = G.score > G.hi;
  if (isBest) { G.hi = G.score; try { localStorage.setItem('jeju_skyfighter_hi', G.hi); } catch (e) {} }
  $('final').innerHTML = `점수 <b style="font-size:34px">${G.score.toLocaleString()}</b><br>${isBest ? '🏆 신기록!' : 'BEST ' + G.hi.toLocaleString()}`;
  setTimeout(() => { if (G.mode === 'over') $('over').classList.remove('hidden'); }, 1200);
  updateHud();
}
function togglePause() {
  if (G.mode === 'play') { G.mode = 'paused'; $('paused').classList.remove('hidden'); }
  else if (G.mode === 'paused') { G.mode = 'play'; $('paused').classList.add('hidden'); }
}

// ---------- 입력 ----------
const keys = new Set();
addEventListener('keydown', e => {
  const k = e.key.toLowerCase(); keys.add(k);
  if (k === 'p' || k === 'escape') togglePause();
  if ((k === 'enter' || k === ' ') && G.mode === 'menu') startGame();
  if ((k === 'enter' || k === ' ') && G.mode === 'over' && !$('over').classList.contains('hidden')) startGame();
  if (k.startsWith('arrow') || k === ' ') e.preventDefault();
});
addEventListener('keyup', e => keys.delete(e.key.toLowerCase()));
addEventListener('blur', () => { keys.clear(); if (G.mode === 'play') togglePause(); });
const view = { reachX: XR };
function aimAt(e) {
  if (e.target.closest && e.target.closest('#tools')) return;
  const touch = e.pointerType === 'touch';
  target.x = (e.clientX / innerWidth * 2 - 1) * view.reachX * 1.05;
  target.y = -(e.clientY / innerHeight * 2 - 1) * YR * 1.2 + (touch ? 3 : 0);   // 터치: 손가락에 가리지 않게 기체를 위로
}
addEventListener('pointermove', aimAt);
addEventListener('pointerdown', aimAt);
addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('visibilitychange', () => { if (document.hidden && G.mode === 'play') togglePause(); });
$('pauseBtn').onclick = () => togglePause();
$('paused').addEventListener('pointerdown', () => togglePause());
$('startBtn').onclick = startGame; $('retryBtn').onclick = startGame;
$('bSnd').onclick = () => { muted = !muted; $('bSnd').textContent = muted ? '🔇 소리' : '🔊 소리'; };
addEventListener('resize', () => {
  renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
});

// ---------- 루프 ----------
let last = performance.now();
function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min((now - last) / 1000, .05); last = now;
  if (G.mode === 'play') update(dt);
  else if (G.mode === 'menu' || G.mode === 'over') {
    // 메뉴/게임오버: 배경만 흘러감
    world.speed = 30;
    for (let i = 0; i < SN; i++) { starPos[i*3+2] += world.speed * dt * .9; if (starPos[i*3+2] > 20) starPos[i*3+2] = -320; }
    starGeo.attributes.position.needsUpdate = true;
    if (G.mode === 'menu') { ship.position.set(Math.sin(now / 900) * 3, Math.cos(now / 700), 0); ship.rotation.z = Math.cos(now / 900) * .4; }
    for (const r of rocks) { r.mesh.position.z += world.speed * dt; }
  }
  if (G.mode !== 'paused') updateParticles(dt);
  updateCamera(dt);
  renderer.render(scene, camera);
}
updateHud();
requestAnimationFrame(loop);
</script>
</body>
