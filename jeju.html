<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jeju Island</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #bfe3f7;
    font-family: "Malgun Gothic", "맑은 고딕", system-ui, sans-serif; }
  canvas { display: block; }
  #title { position: fixed; top: 16px; left: 20px; color: #0d3b5c; pointer-events: none; text-shadow: 0 1px 6px rgba(255,255,255,.7); }
  #title h1 { margin: 0; font-size: 30px; letter-spacing: 4px; }
  #title p { margin: 4px 0 0; font-size: 13px; opacity: .8; }
  #ui { position: fixed; left: 16px; bottom: 16px; display: flex; gap: 8px; flex-wrap: wrap; }
  #ui button, #back { background: rgba(255,255,255,.75); color: #0d3b5c; border: 1px solid #5a93b8; border-radius: 6px;
    padding: 8px 14px; cursor: pointer; font-size: 14px; font-family: inherit; text-decoration: none; }
  #ui button:hover, #back:hover { background: #fff; }
  #back { position: fixed; top: 16px; right: 16px; }
  .label { position: fixed; left: 0; top: 0; transform: translate(-50%, -100%); pointer-events: none; white-space: nowrap;
    color: #fff; background: rgba(13,59,92,.7); padding: 3px 9px; border-radius: 12px; font-size: 13px; }
</style>
</head>
<body>
<div id="title"><h1>JEJU 제주도</h1><p>드래그: 회전 · 휠: 확대 · 버튼: 명소로 이동</p></div>
<a id="back" href="index.html">← 처음으로</a>
<div id="ui">
  <button data-v="all">섬 전체</button>
  <button data-v="halla">한라산</button>
  <button data-v="sungsan">성산일출봉</button>
  <button data-v="hareubang">돌하르방</button>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const SKY = 0xbfe3f7;
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(SKY);
scene.fog = new THREE.Fog(SKY, 160, 420);
const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 1000);
camera.position.set(0, 60, 95);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 2, 0);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI * 0.49;
controls.minDistance = 4; controls.maxDistance = 260;
controls.autoRotate = true; controls.autoRotateSpeed = 0.35;

scene.add(new THREE.HemisphereLight(0xdff2ff, 0x6b8a5a, 1.0));
const sun = new THREE.DirectionalLight(0xfff1d6, 2.2);
sun.position.set(-60, 90, 50); scene.add(sun);

// ---------- noise / random ----------
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rand = rng(7);
function hash(x, y) { const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return s - Math.floor(s); }
function vnoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  return hash(xi, yi) * (1 - u) * (1 - v) + hash(xi + 1, yi) * u * (1 - v) + hash(xi, yi + 1) * (1 - u) * v + hash(xi + 1, yi + 1) * u * v;
}
function fbm(x, y) { let a = .5, s = 0; for (let i = 0; i < 4; i++) { s += a * vnoise(x, y); x *= 2; y *= 2; a *= .5; } return s; }
const smooth = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };

// ---------- terrain ----------
const HALLA = { x: -6, z: 0 };
const SUNGSAN = { x: 47, z: -4 };
const CA = Math.cos(0.15), SA = Math.sin(0.15);
const oreums = [];
while (oreums.length < 30) {
  const x = (rand() - .5) * 100, z = (rand() - .5) * 46;
  const d = Math.hypot((x * CA + z * SA) / 52, (-x * SA + z * CA) / 24);
  if (d > 0.75 || Math.hypot(x - HALLA.x, z) < 12) continue;
  oreums.push({ x, z, a: 1 + rand() * 1.8, s: 1.5 + rand() * 1.5 });
}

function heightAt(x, z) {
  const xr = x * CA + z * SA, zr = -x * SA + z * CA;
  let d = Math.hypot(xr / 52, zr / 24) + (fbm(x * .06 + 10, z * .06 + 10) - .5) * .35;
  const s = smooth(0, .35, 1 - d);
  let h = -3 + 3.5 * s;
  if (s > .9) h += (fbm(x * .2, z * .2) - .5) * .5;
  // Hallasan (shield volcano) + Baengnokdam crater
  const r = Math.hypot((x - HALLA.x) * .85, z - HALLA.z);
  h += 14 * Math.exp(-Math.pow(r / 15, 1.7)) * smooth(0, .4, s);
  h -= 1.3 * Math.exp(-Math.pow(r / 1.3, 2));
  // oreums (parasitic cones)
  for (const o of oreums) {
    const q = Math.hypot(x - o.x, z - o.z);
    h += o.a * Math.exp(-Math.pow(q / o.s, 2)) - o.a * .4 * Math.exp(-Math.pow(q / (o.s * .4), 2));
  }
  // Seongsan Ilchulbong
  const q = Math.hypot(x - SUNGSAN.x, z - SUNGSAN.z);
  h += 3.6 * Math.exp(-Math.pow(q / 5, 3)) + 3.0 * Math.exp(-Math.pow(q / 2.6, 4)) - 2.2 * Math.exp(-Math.pow(q / 1.1, 2));
  return h;
}

{
  const SIZE = 150, SEG = 300;
  const g = new THREE.PlaneGeometry(SIZE * 1.4, SIZE * .8, SEG, Math.round(SEG * .57));
  g.rotateX(-Math.PI / 2);
  const p = g.attributes.position, col = new Float32Array(p.count * 3), c = new THREE.Color();
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), z = p.getZ(i), h = heightAt(x, z);
    p.setY(i, h);
    const n = fbm(x * .5, z * .5);
    if (h < -0.1) c.setRGB(.18 + n * .1, .42 + n * .1, .48);                 // seabed
    else if (h < 0.35) c.setRGB(.86, .8, .6);                                // beach
    else if (h < 6) c.setRGB(.2 + n * .12, .5 + n * .15, .17);               // forest / fields
    else if (h < 10) c.lerpColors(new THREE.Color(.25, .5, .2), new THREE.Color(.4, .36, .32), (h - 6) / 4);
    else c.setRGB(.26 + n * .06, .24 + n * .05, .23 + n * .05);             // basalt summit
    if (h > .35 && h < 3 && n > .6) c.lerp(new THREE.Color(.9, .75, .2), .5); // canola patches
    col.set([c.r, c.g, c.b], i * 3);
  }
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  g.computeVertexNormals();
  scene.add(new THREE.Mesh(g, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 1, flatShading: false })));
}

// ---------- ocean ----------
const sea = new THREE.Mesh(new THREE.PlaneGeometry(900, 900, 150, 150).rotateX(-Math.PI / 2),
  new THREE.MeshStandardMaterial({ color: 0x1b8fc9, roughness: .25, metalness: .1, transparent: true, opacity: .82 }));
scene.add(sea);
const seaPos = sea.geometry.attributes.position, seaBase = Float32Array.from(seaPos.array);

// Baengnokdam crater lake
{
  const cy = heightAt(HALLA.x, HALLA.z);
  const lake = new THREE.Mesh(new THREE.CircleGeometry(0.95, 24).rotateX(-Math.PI / 2),
    new THREE.MeshStandardMaterial({ color: 0x2a9fd6, roughness: .1 }));
  lake.position.set(HALLA.x, cy + .2, HALLA.z); scene.add(lake);
}

// ---------- tangerine trees ----------
{
  const trees = [];
  while (trees.length < 220) {
    const x = (rand() - .5) * 110, z = (rand() - .5) * 50, h = heightAt(x, z);
    if (h < .5 || h > 3 || Math.hypot(x - HALLA.x, z) < 14) continue;
    trees.push({ x, z, h });
  }
  const canopy = new THREE.InstancedMesh(new THREE.IcosahedronGeometry(.4, 1), new THREE.MeshStandardMaterial({ color: 0x2e7d32, roughness: 1 }), trees.length);
  const fruit = new THREE.InstancedMesh(new THREE.SphereGeometry(.07, 6, 5), new THREE.MeshStandardMaterial({ color: 0xff8a00, emissive: 0x552200 }), trees.length * 5);
  const m = new THREE.Object3D(); let fi = 0;
  trees.forEach((t, i) => {
    m.position.set(t.x, t.h + .3, t.z); m.rotation.set(0, 0, 0); m.scale.setScalar(.8 + rand() * .5); m.updateMatrix(); canopy.setMatrixAt(i, m.matrix);
    for (let k = 0; k < 5; k++) {
      const a = rand() * 6.28, b = rand() * 2 - .6;
      m.position.set(t.x + Math.cos(a) * .38, t.h + .3 + b * .3, t.z + Math.sin(a) * .38); m.scale.setScalar(1); m.updateMatrix(); fruit.setMatrixAt(fi++, m.matrix);
    }
  });
  scene.add(canopy, fruit);
}

// ---------- dol hareubang ----------
const HPOS = new THREE.Vector3(16, 0, 11); HPOS.y = heightAt(HPOS.x, HPOS.z);
{
  const stone = new THREE.MeshStandardMaterial({ color: 0x5b5852, roughness: 1, flatShading: true });
  const dark = new THREE.MeshStandardMaterial({ color: 0x2b2926, roughness: 1 });
  const g = new THREE.Group();
  const add = (geo, mat, x, y, z, rx = 0, ry = 0, rz = 0, s) => { const o = new THREE.Mesh(geo, mat); o.position.set(x, y, z); o.rotation.set(rx, ry, rz); if (s) o.scale.set(...s); g.add(o); return o; };
  add(new THREE.CylinderGeometry(.55, .72, 1.2, 10), stone, 0, .6, 0);
  add(new THREE.SphereGeometry(.55, 12, 10), stone, 0, 1.55, 0, 0, 0, 0, [1, 1.05, 1]);
  add(new THREE.CylinderGeometry(.5, .6, .42, 12), stone, 0, 2.05, 0);
  add(new THREE.CylinderGeometry(.78, .78, .08, 16), stone, 0, 1.88, 0);
  add(new THREE.BoxGeometry(.16, .36, .2), stone, 0, 1.48, .54, -.2);
  for (const s of [-1, 1]) add(new THREE.SphereGeometry(.13, 10, 8), dark, s * .2, 1.66, .47, 0, 0, 0, [1, .8, .6]);
  add(new THREE.BoxGeometry(.3, .04, .08), dark, 0, 1.24, .5);
  add(new THREE.BoxGeometry(.36, .16, .22), stone, -.22, 1.05, .68, 0, .2);
  add(new THREE.BoxGeometry(.36, .16, .22), stone, .22, .78, .7, 0, -.2);
  g.scale.setScalar(1.3); g.position.copy(HPOS); g.rotation.y = 0.5;
  scene.add(g);
}

// ---------- clouds ----------
const clouds = [];
{
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const x = c.getContext('2d'), gr = x.createRadialGradient(64, 64, 0, 64, 64, 64);
  gr.addColorStop(0, 'rgba(255,255,255,.95)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
  x.fillStyle = gr; x.fillRect(0, 0, 128, 128);
  const tex = new THREE.CanvasTexture(c);
  for (let i = 0; i < 14; i++) {
    const grp = new THREE.Group(), n = 4 + (rand() * 4 | 0);
    for (let k = 0; k < n; k++) {
      const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false, opacity: .85 }));
      s.scale.set(14 + rand() * 10, 8 + rand() * 4, 1); s.position.set(k * 5 - n * 2.5, rand() * 1.5, rand() * 3); grp.add(s);
    }
    grp.position.set((rand() - .5) * 220, 17 + rand() * 8, (rand() - .5) * 110);
    scene.add(grp); clouds.push(grp);
  }
}

// ---------- fishing boats ----------
const boats = [];
for (let i = 0; i < 4; i++) {
  const b = new THREE.Group();
  const hull = new THREE.Mesh(new THREE.BoxGeometry(1.8, .4, .7), new THREE.MeshStandardMaterial({ color: 0xf4f4f4 }));
  const cab = new THREE.Mesh(new THREE.BoxGeometry(.6, .5, .5), new THREE.MeshStandardMaterial({ color: 0x2255aa })); cab.position.set(-.3, .45, 0);
  const bow = new THREE.Mesh(new THREE.ConeGeometry(.35, .7, 4), new THREE.MeshStandardMaterial({ color: 0xf4f4f4 })); bow.rotation.z = -Math.PI / 2; bow.rotation.x = Math.PI / 4; bow.position.set(1.2, 0, 0);
  b.add(hull, cab, bow); b.scale.setScalar(1.5); scene.add(b);
  boats.push({ b, off: i / 4 * Math.PI * 2, speed: .03 + i * .004, rx: 68 + i * 5, rz: 40 + i * 3 });
}

// ---------- labels ----------
const labels = [];
function addLabel(text, v) { const el = document.createElement('div'); el.className = 'label'; el.textContent = text; document.body.appendChild(el); labels.push({ el, v }); }
addLabel('한라산 1,947m', new THREE.Vector3(HALLA.x, heightAt(HALLA.x, HALLA.z) + 2.5, HALLA.z));
addLabel('성산일출봉', new THREE.Vector3(SUNGSAN.x, heightAt(SUNGSAN.x + 2.2, SUNGSAN.z) + 2, SUNGSAN.z));
addLabel('돌하르방', HPOS.clone().add(new THREE.Vector3(0, 3.6, 0)));

// ---------- camera presets ----------
const hy = heightAt(HALLA.x, HALLA.z);
const VIEWS = {
  all: [new THREE.Vector3(0, 60, 95), new THREE.Vector3(0, 2, 0)],
  halla: [new THREE.Vector3(HALLA.x + 6, hy + 8, 22), new THREE.Vector3(HALLA.x, hy - 3, 0)],
  sungsan: [new THREE.Vector3(SUNGSAN.x - 4, 8, SUNGSAN.z + 14), new THREE.Vector3(SUNGSAN.x, 1.5, SUNGSAN.z)],
  hareubang: [HPOS.clone().add(new THREE.Vector3(2.5, 2.6, 6)), HPOS.clone().add(new THREE.Vector3(0, 1.4, 0))],
};
let goal = null;
document.querySelectorAll('#ui button').forEach(b => b.onclick = () => { goal = VIEWS[b.dataset.v]; controls.autoRotate = b.dataset.v === 'all'; });
controls.addEventListener('start', () => { goal = null; controls.autoRotate = false; });
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

// ---------- loop ----------
const clock = new THREE.Clock(), tmp = new THREE.Vector3();
renderer.setAnimationLoop(() => {
  const t = clock.getElapsedTime();
  for (let i = 0; i < seaPos.count; i++) {
    const x = seaBase[i * 3], z = seaBase[i * 3 + 2];
    seaPos.setY(i, Math.sin(x * .15 + t * 1.2) * .12 + Math.cos(z * .2 + t * .9) * .1);
  }
  seaPos.needsUpdate = true;
  for (const c of clouds) { c.position.x += .01; if (c.position.x > 130) c.position.x = -130; }
  for (const o of boats) {
    const a = o.off + t * o.speed, nx = Math.cos(a) * o.rx, nz = Math.sin(a) * o.rz;
    o.b.position.set(nx, .15 + Math.sin(t * 2 + o.off) * .08, nz);
    o.b.rotation.y = -Math.atan2(Math.cos(a) * o.rz, -Math.sin(a) * o.rx);
    o.b.rotation.z = Math.sin(t * 1.5 + o.off) * .05;
  }
  if (goal) { camera.position.lerp(goal[0], .04); controls.target.lerp(goal[1], .06); }
  controls.update();
  for (const l of labels) {
    tmp.copy(l.v).project(camera);
    const vis = tmp.z < 1 && Math.abs(tmp.x) < 1.1 && Math.abs(tmp.y) < 1.1;
    l.el.style.display = vis ? 'block' : 'none';
    if (vis) { l.el.style.left = (tmp.x * .5 + .5) * innerWidth + 'px'; l.el.style.top = (-tmp.y * .5 + .5) * innerHeight + 'px'; }
  }
  renderer.render(scene, camera);
});
</script>
</body>
</html>
