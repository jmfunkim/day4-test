<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>감귤이의 제주 대모험</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #0b1020; overflow: hidden; touch-action: none; user-select: none;
    font-family: 'Jua', 'Malgun Gothic', system-ui, sans-serif; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; background: #000; box-shadow: 0 0 40px rgba(0,0,0,.6); }
  #tools { position: fixed; top: 10px; right: 10px; display: flex; gap: 6px; z-index: 2; }
  #tools button, #home { background: rgba(0,0,0,.45); color: #fff; border: 1px solid rgba(255,255,255,.4); border-radius: 8px;
    padding: 6px 10px; font-size: 15px; cursor: pointer; font-family: inherit; text-decoration: none; }
  #tools button.off { opacity: .45; text-decoration: line-through; }
  #rot { display: none; position: fixed; top: 52px; left: 0; right: 0; text-align: center; color: #fff; font-size: 14px; z-index: 2; pointer-events: none; text-shadow: 0 1px 4px #000; }
  @media (orientation: portrait) { #rot { display: block; } }
  #home { position: fixed; bottom: 10px; right: 10px; z-index: 2; font-size: 13px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="tools">
  <button id="bSnd">🔊 소리</button>
  <button id="bVoc">🗣 음성</button>
  <button id="bPau">⏸ 일시정지</button>
</div>
<div id="rot">📱 가로로 돌리면 더 크게 즐길 수 있어요 · 탭: 점프 / 아래로 스와이프: 찍기</div>
<a id="home" href="index.html">← 메인화면으로</a>

<script>
'use strict';
// =====================================================================
//  감귤이의 제주 대모험  —  Jeju tangerine runner / platformer
// =====================================================================
const W = 960, H = 540, GY = 440, HY = 350;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
cv.width = W * 2; cv.height = H * 2;
function fit() { const s = Math.min(innerWidth / W, innerHeight / H); cv.style.width = W * s + 'px'; cv.style.height = H * s + 'px'; }
addEventListener('resize', fit); fit();

const rnd = Math.random, TAU = Math.PI * 2;
const hsh = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;

// ---------------------------------------------------------------------
//  AUDIO : synthesized SFX + chiptune BGM + Korean voice (speechSynthesis)
// ---------------------------------------------------------------------
let AC = null, master, sfxBus, musicBus, noiseBuf, soundOn = true, voiceOn = true;
function audioInit() {
  if (AC) { AC.resume(); return; }
  AC = new (window.AudioContext || window.webkitAudioContext)();
  master = AC.createGain(); master.gain.value = soundOn ? .8 : 0; master.connect(AC.destination);
  sfxBus = AC.createGain(); sfxBus.gain.value = .7; sfxBus.connect(master);
  musicBus = AC.createGain(); musicBus.gain.value = .32; musicBus.connect(master);
  noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
  const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = rnd() * 2 - 1;
}
function tone(f, d, type = 'square', v = .2, slide = 0, at = 0, bus) {
  if (!AC) return;
  const o = AC.createOscillator(), g = AC.createGain(), t0 = AC.currentTime + at;
  o.type = type; o.frequency.setValueAtTime(f, t0);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, f * slide), t0 + d);
  g.gain.setValueAtTime(v, t0); g.gain.exponentialRampToValueAtTime(.001, t0 + d);
  o.connect(g); g.connect(bus || sfxBus); o.start(t0); o.stop(t0 + d + .03);
}
function noise(d, v = .2, hp = 1000, at = 0, bus) {
  if (!AC) return;
  const s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain(), t0 = AC.currentTime + at;
  s.buffer = noiseBuf; f.type = 'highpass'; f.frequency.value = hp;
  g.gain.setValueAtTime(v, t0); g.gain.exponentialRampToValueAtTime(.001, t0 + d);
  s.connect(f); f.connect(g); g.connect(bus || sfxBus); s.start(t0, rnd() * .5); s.stop(t0 + d + .03);
}
const PENT = [0, 2, 4, 7, 9];
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
const SFX = {
  jump() { tone(380, .18, 'square', .16, 2.2); },
  djump() { tone(520, .22, 'triangle', .22, 2.4); tone(1040, .12, 'sine', .1, 1.5, .05); },
  coin(c) { const i = Math.min(c, 14), f = 523.25 * Math.pow(2, (PENT[i % 5] + 12 * Math.floor(i / 5)) / 12);
    tone(f, .13, 'square', .13); tone(f * 2, .13, 'triangle', .08, 0, .045); },
  gold() { [784, 988, 1175, 1568].forEach((f, i) => tone(f, .16, 'square', .14, 0, i * .05)); },
  stomp() { tone(220, .22, 'sawtooth', .25, .3); noise(.12, .2, 800); },
  boing() { tone(180, .45, 'sine', .4, 4); tone(360, .3, 'triangle', .15, 3, .02); },
  land() { noise(.06, .12, 300); },
  smash() { noise(.25, .35, 200); tone(120, .3, 'sawtooth', .3, .3); },
  hurt() { tone(320, .45, 'sawtooth', .28, .3); noise(.2, .2, 600); },
  power() { [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, .14, 'square', .14, 0, i * .06)); },
  shieldBreak() { tone(900, .25, 'triangle', .2, .2); noise(.2, .15, 3000); },
  fever() { [392, 523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, .12, 'sawtooth', .13, 0, i * .05)); },
  stage() { [523, 659, 784, 1047].forEach((f, i) => { tone(f, .3, 'square', .14, 0, i * .12); tone(f / 2, .3, 'triangle', .14, 0, i * .12); }); },
  mission() { [659, 784, 988, 1319].forEach((f, i) => tone(f, .18, 'triangle', .2, 0, i * .08)); },
  over() { [440, 392, 330, 262, 196].forEach((f, i) => tone(f, .35, 'triangle', .25, 0, i * .22)); },
  combo() { [880, 1109, 1319, 1760].forEach((f, i) => tone(f, .1, 'square', .1, 0, i * .04)); },
};
function sfx(n, a) { if (soundOn && AC) SFX[n](a); }

// BGM — 16th-note step sequencer, 4-chord loop, pentatonic lead that changes per stage
let bgmTimer = null, nextT = 0, step = 0, melody = [], bpm = 128;
const ROOTS = [60, 57, 55, 62], CHORD = [0, -3, -5, -7], KEYSHIFT = [0, 3, -2, 5];
function newMelody() { melody = Array.from({ length: 32 }, () => rnd() < .28 ? -1 : (rnd() * 10) | 0); }
function playStep(s, when) {
  const at = when - AC.currentTime, root = ROOTS[curStage % 4] + CHORD[(s >> 4) & 3] + KEYSHIFT[curStage % 4] * 0;
  if (s % 4 === 0) { tone(150, .13, 'sine', .55, .25, at, musicBus); }
  if (s % 8 === 4) noise(.1, .22, 1500, at, musicBus);
  if (s & 1) noise(.03, .05, 7000, at, musicBus);
  if (s % 4 === 0 || s % 8 === 6) tone(mtof(root - 12), .2, 'triangle', .35, 0, at, musicBus);
  if (s % 8 === 2 || s % 8 === 5) tone(mtof(root), .08, 'square', .05, 0, at, musicBus);
  if (!(s & 1)) {
    const k = melody[(s >> 1) % 32];
    if (k >= 0) tone(mtof(root + 12 + PENT[k % 5] + 12 * Math.floor(k / 5)), .17, powers.fever > 0 ? 'sawtooth' : 'square', .08, 0, at, musicBus);
  }
}
function bgmStart() {
  if (!AC || bgmTimer) return;
  newMelody(); nextT = AC.currentTime + .1; step = 0;
  bgmTimer = setInterval(() => {
    bpm = 126 + curStage * 5 + (powers.fever > 0 ? 24 : 0);
    while (nextT < AC.currentTime + .15) { playStep(step, nextT); nextT += 60 / bpm / 4; step++; }
  }, 30);
}
function bgmStop() { clearInterval(bgmTimer); bgmTimer = null; }

// Voice
let voices = [], lastSpeak = 0;
function loadVoices() { if ('speechSynthesis' in window) voices = speechSynthesis.getVoices(); }
if ('speechSynthesis' in window) { loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
function say(text, o = {}) {
  if (P) { P.say = text; P.sayT = 2.2; }
  if (!voiceOn || !soundOn || !('speechSynthesis' in window)) return;
  const now = performance.now();
  if (!o.force && now - lastSpeak < 1600) return;
  lastSpeak = now;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR'; const v = voices.find(v => v.lang && v.lang.startsWith('ko')); if (v) u.voice = v;
    u.rate = o.rate || 1.15; u.pitch = o.pitch || 1.5; u.volume = 1;
    speechSynthesis.speak(u);
  } catch (e) {}
}

// ---------------------------------------------------------------------
//  PALETTES (one per stage, smoothly blended)
// ---------------------------------------------------------------------
const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const PAL = [
  { name: '성산 일출 해변', top: '#ff9a6b', bot: '#ffe29a', sun: '#fff3b0', sea: '#2aa8d8', mtn: '#9a7fc0', mtn2: '#5aa06a', gnd: '#c99a5a', grass: '#7bd157', night: 0 },
  { name: '한라산 숲길',   top: '#4fb3ff', bot: '#d7f2ff', sun: '#ffffff', sea: '#1d7fc4', mtn: '#6f9ad0', mtn2: '#2f8a4a', gnd: '#8a6a4a', grass: '#4fb840', night: 0 },
  { name: '노을빛 협재 바다', top: '#5b2a86', bot: '#ff7a59', sun: '#ffd27a', sea: '#c24a8a', mtn: '#8a4d9f', mtn2: '#3d2a6e', gnd: '#6a4a5a', grass: '#c060b0', night: .3 },
  { name: '별빛 오름의 밤', top: '#050b25', bot: '#27306b', sun: '#f4f6ff', sea: '#16286b', mtn: '#232d66', mtn2: '#131c48', gnd: '#2b2a4a', grass: '#2fa07a', night: 1 },
];
PAL.forEach(p => { for (const k of ['top', 'bot', 'sun', 'sea', 'mtn', 'mtn2', 'gnd', 'grass']) p[k] = hex(p[k]); });
const cur = {}; for (const k in PAL[0]) cur[k] = Array.isArray(PAL[0][k]) ? PAL[0][k].slice() : PAL[0][k];
function blendPal(dt, idx) {
  const k = 1 - Math.exp(-dt * 1.6), tg = PAL[idx % 4];
  for (const key in cur) { if (key === 'name') continue; if (Array.isArray(cur[key])) for (let i = 0; i < 3; i++) cur[key][i] = lerp(cur[key][i], tg[key][i], k); else cur[key] = lerp(cur[key], tg[key], k); }
}
const rgb = (a, m = 1) => `rgb(${clamp(a[0] * m, 0, 255) | 0},${clamp(a[1] * m, 0, 255) | 0},${clamp(a[2] * m, 0, 255) | 0})`;

// ---------------------------------------------------------------------
//  GAME STATE
// ---------------------------------------------------------------------
let state = 'title', t = 0, stateT = 0;
let P, plats, ents, picks, parts, texts, storms, genX, nextBonus, lastWasGap;
let shake = 0, flash = null, score = 0, best = 0, combo = 0, comboT = 0, camX = 0, dist = 0, speed = 0, curStage = 0;
let banner = null, trail = [], stats, missions, powers = { magnet: 0, shield: false, fever: 0 }, maxCombo = 0;
try { best = +localStorage.getItem('gyul_best') || 0; } catch (e) {}

const MISSION_POOL = [
  { id: 'tang', text: n => `귤 ${n}개 모으기`, goals: [40, 80, 130] },
  { id: 'stomp', text: n => `적 ${n}마리 밟기`, goals: [5, 10, 16] },
  { id: 'dist', text: n => `${n}m 달리기`, goals: [300, 600, 1000] },
  { id: 'combo', text: n => `${n}콤보 달성`, goals: [15, 30, 50] },
  { id: 'power', text: n => `파워업 ${n}개 획득`, goals: [2, 4, 6] },
];

function resetGame() {
  P = { x: 0, y: GY, vy: 0, onGround: true, jumps: 0, coyote: 0, buf: 0, cut: false, stomping: false, hurtT: 0, hp: 3,
        sx: 1, sy: 1, spinT: 0, blink: 0, run: 0, say: '', sayT: 0, air: 0 };
  plats = [{ x: -600, w: 2200, y: GY, type: 'g' }]; ents = []; picks = []; parts = []; texts = []; storms = [];
  genX = 1600; nextBonus = 340; lastWasGap = false; curStage = 0;
  score = 0; combo = 0; comboT = 0; maxCombo = 0; shake = 0; flash = null; banner = null; trail = []; dist = 0;
  powers = { magnet: 0, shield: false, fever: 0 };
  stats = { tang: 0, stomp: 0, dist: 0, combo: 0, power: 0, gold: 0 };
  const pool = MISSION_POOL.slice().sort(() => rnd() - .5).slice(0, 3);
  missions = pool.map(m => { const goal = m.goals[(rnd() * 3) | 0]; return { id: m.id, text: m.text(goal), goal, done: false }; });
}

function startGame() {
  audioInit(); resetGame(); state = 'play'; stateT = 0;
  banner = { text: PAL[0].name === undefined ? '' : '성산 일출 해변', t: 0 };
  bgmStop(); bgmStart();
  say('혼저 옵서예! 감귤이 출발!', { force: true });
}
function endGame() {
  state = 'over'; stateT = 0; bgmStop(); sfx('over');
  const nb = score > best; if (nb) { best = Math.floor(score); try { localStorage.setItem('gyul_best', best); } catch (e) {} }
  P.newBest = nb;
  say(nb ? '신기록이에요! 대단해요!' : '아쉬워요, 다시 도전해요!', { force: true, pitch: 1.4 });
}
function togglePause() {
  if (state === 'play') { state = 'pause'; bgmStop(); if (AC) AC.suspend(); }
  else if (state === 'pause') { state = 'play'; if (AC) AC.resume(); bgmStart(); }
}

// ---------------------------------------------------------------------
//  WORLD GENERATION
// ---------------------------------------------------------------------
const addPlat = (x, w, y, type) => plats.push({ x, w, y, type });
const tang = (x, y, k = 't') => picks.push({ k, x, y, ph: rnd() * 6 });
function arc(x0, x1, y0, h, n, gold) { for (let i = 0; i < n; i++) { const u = n > 1 ? i / (n - 1) : .5; tang(x0 + (x1 - x0) * u, y0 - 4 * h * u * (1 - u), gold && i === (n >> 1) ? 'gold' : 't'); } }
function enemy(type, x, y) {
  const d = { crab: [50, 34], gull: [54, 34], hare: [60, 100] }[type];
  ents.push({ type, x, ox: x, y, by: y, w: d[0], h: d[1], t: rnd() * 6, range: 50 + rnd() * 60, sq: 0 });
}
function power(x, y) {
  const r = rnd(), kind = r < .3 ? 'magnet' : r < .6 ? 'shield' : r < .85 ? 'fever' : 'life';
  picks.push({ k: 'pw', kind, x, y, ph: 0 });
}
function flatSeg(diff) {
  const len = 450 + rnd() * 450; addPlat(genX, len, GY, 'g');
  for (let x = genX + 220; x < genX + len - 130; x += 240 + rnd() * 160) {
    if (rnd() < .5 + .3 * diff) enemy(rnd() < .62 ? 'crab' : 'hare', x, GY);
  }
  if (rnd() < .4 + .3 * diff) enemy('gull', genX + 250 + rnd() * 200, GY - 110 - rnd() * 130);
  arc(genX + 80, genX + len - 80, GY - 40, 60 + rnd() * 60, 7);
  if (rnd() < .13) power(genX + len / 2 + 60, GY - 140);
  genX += len;
}
function gapSeg(diff) {
  const w = 150 + rnd() * (110 + diff * 70);
  arc(genX - 40, genX + w + 40, GY - 50, 150, 9, rnd() < .3);
  if (w > 250 && rnd() < .5) { addPlat(genX + w / 2 - 50, 100, GY - 90, 'f'); tang(genX + w / 2, GY - 130); }
  genX += w;
}
function stairsSeg(diff) {
  const n = 3 + ((rnd() * 2) | 0); let x = genX + 70;
  for (let i = 0; i < n; i++) {
    const y = GY - 70 - Math.abs(Math.sin(i * 1.3 + .4)) * 110;
    addPlat(x, 120, y, 'f');
    for (let k = 0; k < 3; k++) tang(x + 25 + k * 35, y - 36);
    if (i === n - 1) tang(x + 60, y - 85, 'gold');
    if (rnd() < .3 * diff) enemy('gull', x + 190, y - 70);
    x += 120 + 90 + rnd() * 60;
  }
  if (rnd() < .25) power(genX + 150, GY - 220);
  genX = x + 20;
}
function bounceSeg() {
  const len = 650; addPlat(genX, len, GY, 'g');
  enemy('hare', genX + 280, GY); enemy('crab', genX + 480, GY);
  arc(genX + 190, genX + 390, GY - 120, 210, 7); tang(genX + 290, GY - 330, 'gold');
  genX += len;
}
function stormSeg() {
  const len = 1100; addPlat(genX, len, GY, 'g'); storms.push({ x: genX + 50, done: false });
  for (let i = 0; i < 38; i++) {
    const x = genX + 80 + i * 26;
    tang(x, GY - 110 - Math.sin(i * .4) * 70, i % 12 === 6 ? 'gold' : 't');
    tang(x + 13, GY - 190 - Math.sin(i * .4 + 1.5) * 60);
  }
  for (let i = 0; i < 12; i++) tang(genX + 140 + i * 70, GY - 38);
  genX += len;
}
function gen() {
  const diff = Math.min(1, dist / 1500 + curStage * .12);
  while (genX < P.x + 1700) {
    if (genX / 50 > nextBonus) { stormSeg(); nextBonus += 400; lastWasGap = false; continue; }
    const r = rnd();
    if (lastWasGap || r < .4) { flatSeg(diff); lastWasGap = false; }
    else if (r < .7) { gapSeg(diff); lastWasGap = true; }
    else if (r < .85) { stairsSeg(diff); lastWasGap = true; }
    else { bounceSeg(); lastWasGap = false; }
  }
}

// ---------------------------------------------------------------------
//  EFFECTS
// ---------------------------------------------------------------------
function burst(x, y, n, cols, sp = 300, type = 'juice') {
  for (let i = 0; i < n; i++) {
    const a = rnd() * TAU, s = sp * (.3 + rnd() * .7);
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - sp * .3, life: .5 + rnd() * .6, max: 1, size: 3 + rnd() * 5,
      col: cols[(rnd() * cols.length) | 0], type, rot: rnd() * 6, vr: (rnd() - .5) * 14 });
  }
}
function ring(x, y, col, size = 90) { parts.push({ x, y, vx: 0, vy: 0, life: .45, max: .45, size, col, type: 'ring', rot: 0, vr: 0 }); }
function floatText(x, y, text, col = '#fff', size = 24) { texts.push({ x, y, text, col, size, life: 1, vy: -60 }); }
const JUICE = ['#ff9a1f', '#ffb84d', '#ffd24d', '#ff7a00'];
const CONF = ['#ff5e5e', '#ffd24d', '#5ee0ff', '#8cff6a', '#ff7ae6', '#ffffff'];
function confetti(n = 60) { for (let i = 0; i < n; i++) parts.push({ x: camX + rnd() * W, y: -20 - rnd() * 200, vx: (rnd() - .5) * 120, vy: 100 + rnd() * 200,
  life: 2.2, max: 2.2, size: 5 + rnd() * 5, col: CONF[(rnd() * CONF.length) | 0], type: 'conf', rot: rnd() * 6, vr: (rnd() - .5) * 10 }); }

function addCombo(n = 1) {
  const prev = combo; combo += n; comboT = 2.6; maxCombo = Math.max(maxCombo, combo); stats.combo = maxCombo;
  for (const [m, line] of [[10, '대박!'], [25, '와, 미쳤다!'], [50, '전설의 감귤왕!'], [100, '제주의 신이다!']]) {
    if (prev < m && combo >= m) { sfx('combo'); confetti(70); say(line, { force: true }); floatText(P.x, P.y - 110, `${m} COMBO!`, '#ffe14d', 38); score += m * 20; flash = { a: .5, c: '#fff6a0' }; }
  }
}
const mult = () => (1 + Math.min(5, Math.floor(combo / 10))) * (powers.fever > 0 ? 2 : 1);
function addScore(n, x, y, col) { const v = n * mult(); score += v; if (x !== undefined) floatText(x, y, '+' + v, col || '#fff', 20); }

function hurt(src) {
  if (P.hurtT > 0 || powers.fever > 0) return;
  if (powers.shield) { powers.shield = false; P.hurtT = 1; sfx('shieldBreak'); ring(P.x, P.y - 24, '#7fe3ff', 130); burst(P.x, P.y - 24, 18, ['#7fe3ff', '#fff'], 360, 'spark'); say('방어막이 막았어요!'); return; }
  P.hp--; combo = 0; P.hurtT = 1.8; shake = 14; flash = { a: .55, c: '#ff3030' }; sfx('hurt');
  burst(P.x, P.y - 24, 20, JUICE, 380); say('아야!', { force: true, pitch: 1.9 });
  if (P.hp <= 0) { endGame(); return; }
  P.vy = -520; P.onGround = false;
}
function fall() {
  P.hp--; combo = 0; sfx('hurt'); shake = 16; flash = { a: .55, c: '#2060ff' }; burst(P.x, H - 40, 24, ['#bfeaff', '#fff', '#5ec3ff'], 420, 'spark');
  if (P.hp <= 0) { endGame(); return; }
  const np = plats.find(p => p.type === 'g' && p.x > P.x + 80);
  if (np) { P.x = np.x + 70; P.y = np.y; } else { P.y = GY; }
  P.vy = 0; P.hurtT = 2.2; say('풍덩! 조심해요!', { force: true });
}

// ---------------------------------------------------------------------
//  INPUT
// ---------------------------------------------------------------------
function pressJump() { if (state === 'play') P.buf = .13; else if (state === 'title' || (state === 'over' && stateT > .8)) startGame(); else if (state === 'pause') togglePause(); }
function releaseJump() { if (state === 'play') P.cut = true; }
function pressStomp() { if (state === 'play' && !P.onGround && !P.stomping) { P.stomping = true; P.vy = 1500; P.spinT = 0; } }
addEventListener('keydown', e => {
  if (['Space', 'ArrowUp', 'ArrowDown', 'KeyW', 'KeyS'].includes(e.code)) e.preventDefault();
  if (e.repeat) return;
  if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'Enter') pressJump();

const GRAV = 2300;
function doJump(air) {

  else { P.vy = f ? -900 : -800; P.jumps = 1; sfx('jump'); P.sx = .78; P.sy = 1.3; burst(P.x, P.y, 6, ['#e8d3a0', '#fff'], 140, 'dust'); if (!stats.jumped) { stats.jumped = 1; say('폴짝!'); } }

function update(dt) {
  t += dt; stateT += dt;
  blendPal(dt, state === 'title' ? 0 : curStage);
  if (state === 'title') { camX += 170 * dt; P.run += dt * 12; return; }
  if (state === 'pause') return;
  if (state === 'over') { stepFx(dt); return; }

  const fever = powers.fever > 0;
  powers.magnet = Math.max(0, powers.magnet - dt);
  if (powers.fever > 0) { powers.fever -= dt; if (powers.fever <= 0) { say('피버 타임 끝!'); } }
  P.hurtT = Math.max(0, P.hurtT - dt); P.sayT -= dt;
  comboT -= dt; if (comboT <= 0) combo = 0;
  P.blink -= dt; if (P.blink < -3) P.blink = .12;

  dist = P.x / 50; stats.dist = Math.max(stats.dist, dist);
  const stage = Math.floor(dist / 400);
  if (stage !== curStage) {
    curStage = stage; banner = { text: PAL[stage % 4].name, t: 0 }; sfx('stage'); newMelody(); confetti(50);
    say(['', '다음 지역, 한라산 숲길!', '노을빛 협재 바다에 도착!', '별빛 오름의 밤이에요!'][stage % 4] || '다음 지역 도착!', { force: true });
  }
  speed = (330 + curStage * 30 + Math.min(dist * .02, 160)) * (fever ? 1.3 : 1);
  P.x += speed * dt; P.run += dt * speed * .03;
  score += speed * dt * .02 * (fever ? 2 : 1);

  // jump buffer / cut

    P.buf -= dt;
    if (!P.stomping) {
      if (P.onGround || P.coyote > 0) doJump(false);
      else if (P.jumps < (fever ? 3 : 2)) doJump(true);
    }
  }
  if (P.cut) { if (P.vy < -250) P.vy *= .5; P.cut = false; }

  // physics
  const wasGround = P.onGround, prevFeet = P.y;
  P.vy += GRAV * dt; if (P.stomping) P.vy = Math.max(P.vy, 1500);
  P.y += P.vy * dt;
  let landed = null;
  if (P.vy >= 0) for (const pl of plats) {
    if (P.x + 14 > pl.x && P.x - 14 < pl.x + pl.w && prevFeet <= pl.y + 4 && P.y >= pl.y) { landed = pl; break; }
  }
  if (landed) {
    P.y = landed.y;
    if (!wasGround) {
      P.sx = 1.35; P.sy = .68; sfx('land'); burst(P.x, P.y, 6, ['#e8d3a0', '#fff'], 160, 'dust');
      if (P.stomping) {

    const stompable = P.vy > 0 && prevFeet <= tp + 22;
    if (e.type === 'hare') {
      if (stompable) { P.y = tp; P.vy = -980; P.jumps = 1; P.stomping = false; P.onGround = false; e.sq = 1; sfx('boing'); ring(e.x, tp, '#ffe27a', 90); addCombo(2); addScore(30, e.x, tp - 20, '#ffe27a'); say('둥실!'); }
      else if (fever) killEnemy(e, false); else hurt();
    } else if (stompable) {
      killEnemy(e, true); P.vy = rnd() < 2 ? -640 : 0; P.jumps = 1; P.stomping = false; P.onGround = false;
    } else if (fever) killEnemy(e, false);
    else { if (powers.shield) killEnemy(e, false); hurt(); }
  }
  ents = ents.filter(e => !e.dead && e.x > camX - 250);

  // pickups
  const pcx = P.x, pcy = P.y - 24;
  for (const p of picks) {
    if (p.taken) continue; p.ph += dt * 5;
    if (powers.magnet > 0 && p.k !== 'pw') { const dx = pcx - p.x, dy = pcy - p.y, d = Math.hypot(dx, dy); if (d < 280) { p.x += dx / d * 900 * dt; p.y += dy / d * 900 * dt; } }
    if (Math.hypot(p.x - pcx, p.y - pcy) < (p.k === 'pw' ? 38 : 30)) {
      p.taken = true;
      if (p.k === 't') { addCombo(); stats.tang++; addScore(10); sfx('coin', combo); burst(p.x, p.y, 5, JUICE, 160); }
      else if (p.k === 'gold') { addCombo(3); stats.tang++; stats.gold++; addScore(100, p.x, p.y - 20, '#ffe14d'); sfx('gold'); burst(p.x, p.y, 16, ['#ffe14d', '#fff', '#ffb300'], 340, 'spark'); ring(p.x, p.y, '#ffe14d', 80); }
      else {
        stats.power++; sfx('power'); ring(p.x, p.y, '#fff', 120); burst(p.x, p.y, 20, CONF, 360, 'spark'); flash = { a: .35, c: '#ffffff' };
        if (p.kind === 'magnet') { powers.magnet = 9; say('한라봉 자석!', { force: true }); floatText(p.x, p.y - 30, '한라봉 자석!', '#ffd24d', 26); }
        else if (p.kind === 'shield') { powers.shield = true; say('천혜향 방어막!', { force: true }); floatText(p.x, p.y - 30, '천혜향 방어막!', '#7fe3ff', 26); }
        else if (p.kind === 'fever') { powers.fever = 8; sfx('fever'); say('레드향 피버 타임!', { force: true }); floatText(p.x, p.y - 30, 'FEVER TIME!', '#ff5a5a', 32); }
        else { P.hp = Math.min(5, P.hp + 1); say('힘이 났어요!'); floatText(p.x, p.y - 30, '목숨 +1', '#8cff6a', 26); }
      }

  plats = plats.filter(p => p.x + p.w > camX - 400);

  // storm announce
  for (const s of storms) if (!s.done && P.x > s.x) { s.done = true; banner = { text: '🍊 귤 폭풍! 🍊', t: 0 }; sfx('stage'); say('귤 폭풍이에요! 마음껏 먹어요!', { force: true }); }

  // missions

    m.done = true; score += 1000; sfx('mission'); confetti(40); say('미션 성공!', { force: true }); floatText(P.x, P.y - 130, '미션 성공! +1000', '#8cff6a', 30);
  }

  stepFx(dt);
  best = Math.max(best, 0);
}
function killEnemy(e, stomp) {
  e.dead = true; stats.stomp++; addCombo(); sfx(stomp ? 'stomp' : 'smash');
  addScore(50, e.x, e.y - e.h - 10, '#ffd24d'); burst(e.x, e.y - e.h / 2, 14, e.type === 'crab' ? ['#ff5040', '#ff8a70', '#fff'] : ['#fff', '#cfe6ff', '#ffd24d'], 360);

  texts = texts.filter(x => x.life > 0);
  if (banner) { banner.t += dt; if (banner.t > 2.8) banner = null; }
}

      ctx.fillStyle = '#2a1200'; ctx.beginPath(); ctx.ellipse(s * r * .38 + (o.look || 0), ey + 1, r * .11, r * .16, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(s * r * .38 + 1.5, ey - 2.5, r * .05, 0, TAU); ctx.fill(); }

  ctx.fillStyle = `rgba(255,255,255,${.75 - cur.night * .5})`;
  for (let i = 0; i < 7; i++) { const cx = ((hsh(i) * 1400 - camX * .06 - t * 6) % 1400 + 1400) % 1400 - 200, cy = 50 + hsh(i + 9) * 150, s = .7 + hsh(i + 3) * .8;
    ctx.beginPath(); ctx.arc(cx, cy, 24 * s, 0, TAU); ctx.arc(cx + 28 * s, cy + 6, 20 * s, 0, TAU); ctx.arc(cx - 26 * s, cy + 8, 18 * s, 0, TAU); ctx.arc(cx + 5, cy - 10 * s, 20 * s, 0, TAU); ctx.fill(); }
  ridge(.12, HY, 190, rgb(cur.mtn), 2800, 1.3, true);   // Hallasan
  // Seongsan Ilchulbong
  ctx.fillStyle = rgb(cur.mtn2); const per = 3000, off = (((-camX * .3) % per) + per) % per;
  for (let k = -1; k <= 1; k++) { const bx = off + k * per + 420; ctx.beginPath(); ctx.moveTo(bx - 230, HY + 2); ctx.lineTo(bx - 120, HY - 85); ctx.lineTo(bx - 70, HY - 105); ctx.lineTo(bx - 30, HY - 90); ctx.lineTo(bx + 10, HY - 108); ctx.lineTo(bx + 70, HY - 100); ctx.lineTo(bx + 130, HY - 62); ctx.lineTo(bx + 250, HY + 2); ctx.fill(); }
  ridge(.3, HY, 55, rgb(cur.mtn2, .85), 1100, 4.1, false);
  // sea
  const sg = ctx.createLinearGradient(0, HY, 0, H); sg.addColorStop(0, rgb(cur.sea, 1.25)); sg.addColorStop(1, rgb(cur.sea, .7)); ctx.fillStyle = sg; ctx.fillRect(0, HY, W, H - HY);
  ctx.strokeStyle = 'rgba(255,255,255,.28)'; ctx.lineWidth = 2;
  for (let r = 0; r < 6; r++) { const y = HY + 12 + r * 30; ctx.beginPath(); for (let x = 0; x <= W; x += 14) { const yy = y + Math.sin((x + camX * (.4 + r * .1)) * .03 + t * 2 + r) * 4; x ? ctx.lineTo(x, yy) : ctx.moveTo(x, yy); } ctx.stroke(); }
}
function drawFG() {
  const x0 = camX - 60, x1 = camX + W + 60;
  for (const pl of plats) {
    if (pl.x > x1 || pl.x + pl.w < x0) continue;
    const a = Math.max(pl.x, x0), b = Math.min(pl.x + pl.w, x1), y = pl.y;
    if (pl.type === 'g') {
      const g = ctx.createLinearGradient(0, y, 0, H); g.addColorStop(0, rgb(cur.gnd, 1.1)); g.addColorStop(1, rgb(cur.gnd, .55)); ctx.fillStyle = g; ctx.fillRect(a, y, b - a, H - y);
      ctx.fillStyle = 'rgba(0,0,0,.18)'; for (let i = Math.floor(a / 46); i < b / 46; i++) { ctx.beginPath(); ctx.ellipse(i * 46 + hsh(i) * 20, y + 28 + hsh(i + 7) * 60, 9 + hsh(i + 2) * 8, 5, 0, 0, TAU); ctx.fill(); }
      ctx.fillStyle = rgb(cur.grass); ctx.fillRect(a, y, b - a, 14); ctx.fillStyle = rgb(cur.grass, .8); ctx.fillRect(a, y + 11, b - a, 5);
      ctx.fillStyle = rgb(cur.grass, 1.15); for (let i = Math.floor(a / 20); i < b / 20; i++) { ctx.beginPath(); ctx.moveTo(i * 20, y); ctx.lineTo(i * 20 + 5, y - 6 - hsh(i) * 4); ctx.lineTo(i * 20 + 10, y); ctx.fill(); }
      // decor
      for (let i = Math.floor(a / 170); i <= b / 170; i++) {
        const cx = i * 170 + 40 + hsh(i + 33) * 80; if (cx < pl.x + 70 || cx > pl.x + pl.w - 70) continue;
        const h = hsh(i);
        if (h < .22) palm(cx, y + 4, .9 + hsh(i + 1) * .3); else if (h < .38) wall(cx, y + 2); else if (h < .55) canola(cx, y + 2); else if (h < .68) tree(cx, y + 2);
      }
    } else {
      ctx.fillStyle = rgb(cur.gnd, .7); ctx.beginPath(); ctx.moveTo(pl.x, y + 8); ctx.lineTo(pl.x + pl.w, y + 8); ctx.lineTo(pl.x + pl.w - 18, y + 38); ctx.lineTo(pl.x + pl.w / 2, y + 52); ctx.lineTo(pl.x + 18, y + 38); ctx.fill();
      ctx.fillStyle = rgb(cur.grass); ctx.beginPath(); ctx.moveTo(pl.x - 4, y + 12); ctx.quadraticCurveTo(pl.x - 4, y - 2, pl.x + 10, y); ctx.lineTo(pl.x + pl.w - 10, y); ctx.quadraticCurveTo(pl.x + pl.w + 4, y - 2, pl.x + pl.w + 4, y + 12); ctx.fill();
      ctx.fillStyle = rgb(cur.grass, 1.2); ctx.fillRect(pl.x + 6, y, pl.w - 12, 4);
    }
  }
  // foreground waves in pits
  ctx.fillStyle = 'rgba(255,255,255,.35)'; for (let x = Math.floor(x0 / 34) * 34; x < x1; x += 34) { ctx.beginPath(); ctx.arc(x + Math.sin(t * 3 + x) * 5, H - 14 + Math.sin(t * 4 + x * .1) * 4, 14, Math.PI, 0); ctx.fill(); }
}

// ---------------------------------------------------------------------
//  DRAWING — entities
// ---------------------------------------------------------------------
function drawHare(e) {
  const sq = Math.sin(e.sq * Math.PI) * .25; ctx.save(); ctx.translate(e.x, e.y); ctx.scale(1 + sq, 1 - sq);
  ctx.fillStyle = '#74706a'; ctx.beginPath(); ctx.moveTo(-24, 0); ctx.lineTo(-20, -50); ctx.lineTo(20, -50); ctx.lineTo(24, 0); ctx.fill();
  ctx.fillStyle = '#85817a'; ctx.beginPath(); ctx.arc(0, -66, 23, 0, TAU); ctx.fill();
  ctx.fillStyle = '#5e5a55'; ctx.fillRect(-32, -86, 64, 7); ctx.beginPath(); ctx.moveTo(-19, -86); ctx.quadraticCurveTo(0, -112, 19, -86); ctx.fill();
  ctx.fillStyle = '#1e1c1a'; for (const s of [-1, 1]) { ctx.beginPath(); ctx.ellipse(s * 9, -68, 5, 6.5, 0, 0, TAU); ctx.fill(); }
  ctx.fillStyle = '#6a665f'; ctx.beginPath(); ctx.moveTo(-4, -66); ctx.lineTo(4, -66); ctx.lineTo(6, -54); ctx.lineTo(-6, -54); ctx.fill();
  ctx.fillStyle = '#4a4743'; ctx.fillRect(-7, -52, 14, 2.5);
  ctx.fillStyle = '#6a665f'; ctx.fillRect(-18, -42, 14, 9); ctx.fillRect(4, -34, 14, 9);
  const p = .5 + .5 * Math.sin(t * 6); ctx.strokeStyle = `rgba(255,226,122,${.5 + p * .5})`; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(-14, -122 - p * 4); ctx.lineTo(0, -132 - p * 4); ctx.lineTo(14, -122 - p * 4); ctx.stroke();
  ctx.restore();
}
function drawCrab(e) {
  const wig = Math.sin(e.t * 12); ctx.save(); ctx.translate(e.x, e.y);
  ctx.strokeStyle = '#c23020'; ctx.lineWidth = 3; for (const s of [-1, 1]) for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.moveTo(s * 10, -10); ctx.lineTo(s * (22 + i * 4), -4 + (i % 2 ? wig * 2 : -wig * 2)); ctx.lineTo(s * (26 + i * 4), 0); ctx.stroke(); }
  ctx.fillStyle = '#ff5040'; ctx.beginPath(); ctx.ellipse(0, -16, 24, 15, 0, 0, TAU); ctx.fill();
  for (const s of [-1, 1]) { ctx.beginPath(); ctx.arc(s * 26, -28 + wig * 3 * s, 8, 0, TAU); ctx.fill(); ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(s * 8, -33, 6, 0, TAU); ctx.fill(); ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(s * 8 + 1, -33, 3, 0, TAU); ctx.fill(); ctx.fillStyle = '#ff5040'; }
  ctx.strokeStyle = '#111'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(-8, -14); ctx.lineTo(0, -10); ctx.lineTo(8, -14); ctx.stroke(); ctx.restore();
}
function drawGull(e) {
  const fl = Math.sin(e.t * 12) * 16; ctx.save(); ctx.translate(e.x, e.y - 17);
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.ellipse(0, 0, 20, 11, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = '#dfe9f2'; for (const s of [-1, 1]) { ctx.beginPath(); ctx.moveTo(s * 4, -2); ctx.quadraticCurveTo(s * 20, -26 - fl, s * 34, -12 - fl); ctx.quadraticCurveTo(s * 20, -6, s * 4, 4); ctx.fill(); }
  ctx.fillStyle = '#ffb020'; ctx.beginPath(); ctx.moveTo(-18, -2); ctx.lineTo(-30, 1); ctx.lineTo(-18, 4); ctx.fill();
  ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(-11, -3, 2.6, 0, TAU); ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = '#111'; ctx.beginPath(); ctx.moveTo(-16, -8); ctx.lineTo(-7, -5); ctx.stroke(); ctx.restore();
}
function drawPlayer() {
  const fever = powers.fever > 0;
  if (P.hurtT > 0 && Math.floor(P.hurtT * 14) % 2 === 0) return;
  // trail
  if (fever || speed > 520) for (let i = 0; i < trail.length; i++) { const q = trail[i], a = i / trail.length; ctx.fillStyle = fever ? `hsla(${(t * 400 + i * 20) % 360},95%,60%,${a * .5})` : `rgba(255,200,100,${a * .22})`; ctx.beginPath(); ctx.arc(q.x, q.y, 22 * a, 0, TAU); ctx.fill(); }
  const cy = P.y - 24 * P.sy;
  if (fever) { const gl = ctx.createRadialGradient(P.x, cy, 10, P.x, cy, 90); gl.addColorStop(0, `hsla(${(t * 300) % 360},100%,70%,.7)`); gl.addColorStop(1, 'rgba(255,255,255,0)'); ctx.fillStyle = gl; ctx.beginPath(); ctx.arc(P.x, cy, 90, 0, TAU); ctx.fill(); }
  const rot = P.spinT > 0 ? (1 - P.spinT / .45) * TAU : (P.stomping ? 0 : (P.onGround ? 0 : clamp(P.vy / 3000, -.2, .3)));
  const mouth = P.hurtT > 1.2 ? 'hurt' : (P.onGround ? 'smile' : 'open');
  drawMascot(P.x, cy, 24, P.sx, P.sy, rot, { run: P.onGround ? P.run : undefined, blink: P.blink > 0, mouth, look: 2 });
  if (powers.shield) { ctx.strokeStyle = `rgba(127,227,255,${.6 + Math.sin(t * 8) * .2})`; ctx.lineWidth = 4; ctx.fillStyle = 'rgba(127,227,255,.18)'; ctx.beginPath(); ctx.arc(P.x, P.y - 24, 38, 0, TAU); ctx.fill(); ctx.stroke(); }
  if (powers.magnet > 0) { ctx.strokeStyle = `rgba(255,210,80,${.25 + .15 * Math.sin(t * 10)})`; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(P.x, P.y - 24, 70 + (t * 120 % 60), 0, TAU); ctx.stroke(); }
  if (P.sayT > 0 && P.say) { ctx.font = '18px Jua, sans-serif'; const w = ctx.measureText(P.say).width + 22, bx = P.x - w / 2, by = P.y - 100;
    ctx.fillStyle = '#fff'; ctx.strokeStyle = '#5a2a00'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(bx + 10, by); ctx.lineTo(bx + w - 10, by); ctx.quadraticCurveTo(bx + w, by, bx + w, by + 10); ctx.lineTo(bx + w, by + 24); ctx.quadraticCurveTo(bx + w, by + 34, bx + w - 10, by + 34);
    ctx.lineTo(P.x + 8, by + 34); ctx.lineTo(P.x, by + 46); ctx.lineTo(P.x - 4, by + 34); ctx.lineTo(bx + 10, by + 34); ctx.quadraticCurveTo(bx, by + 34, bx, by + 24); ctx.lineTo(bx, by + 10); ctx.quadraticCurveTo(bx, by, bx + 10, by); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#3a1a00'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(P.say, P.x, by + 18); }
}
function drawParts() {
  for (const p of parts) {
    const a = clamp(p.life / (p.max || 1), 0, 1);
    if (p.type === 'ring') { const k = 1 - p.life / p.max; ctx.strokeStyle = p.col; ctx.globalAlpha = 1 - k; ctx.lineWidth = 5 * (1 - k) + 1; ctx.beginPath(); ctx.arc(p.x, p.y, p.size * k, 0, TAU); ctx.stroke(); ctx.globalAlpha = 1; continue; }
    ctx.globalAlpha = clamp(p.life * 2, 0, 1); ctx.fillStyle = p.col;
    if (p.type === 'spark') { ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.beginPath(); for (let i = 0; i < 4; i++) { ctx.lineTo(Math.cos(i * Math.PI / 2) * p.size * 1.6, Math.sin(i * Math.PI / 2) * p.size * 1.6); ctx.lineTo(Math.cos(i * Math.PI / 2 + Math.PI / 4) * p.size * .4, Math.sin(i * Math.PI / 2 + Math.PI / 4) * p.size * .4); } ctx.fill(); ctx.restore(); }
    else if (p.type === 'conf') { ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2); ctx.restore(); }
    else { ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (p.type === 'dust' ? a : 1), 0, TAU); ctx.fill(); }
    ctx.globalAlpha = 1;
  }
}
function drawHeart(x, y, s) { drawMascot(x, y, s, 1, 1, 0, { mouth: 'smile', blink: false }); }

// ---------------------------------------------------------------------
//  DRAWING — HUD & screens
// ---------------------------------------------------------------------
function drawHUD() {
  for (let i = 0; i < P.hp; i++) drawHeart(34 + i * 40, 34, 15);
  otext(String(Math.floor(score)).padStart(6, '0'), W / 2, 32, 40, '#fff', '#a34a00');
  otext(`🏁 ${Math.floor(dist)}m   🍊 ${stats.tang}   BEST ${Math.max(best, Math.floor(score))}`, W / 2, 66, 18, '#fff', '#5a2a00');
  let y = 66;
  if (powers.magnet > 0) { otext(`🧲 자석 ${powers.magnet.toFixed(1)}s`, 22, y += 28, 17, '#ffe27a', '#5a2a00', 'left'); }
  if (powers.shield) { otext('🛡️ 방어막', 22, y += 28, 17, '#9fefff', '#064a66', 'left'); }
  if (powers.fever > 0) { otext(`🔥 FEVER ${powers.fever.toFixed(1)}s  x2`, 22, y += 28, 19, `hsl(${(t * 400) % 360},100%,70%)`, '#400', 'left'); }
  if (combo >= 2) {
    const s = 1 + Math.min(.6, combo / 80), pulse = 1 + Math.max(0, comboT - 2.3) * 1.2;
    ctx.save(); ctx.translate(W - 30, 110); ctx.rotate(-.06); ctx.scale(s * pulse, s * pulse);
    otext(`${combo} COMBO`, 0, 0, 34, '#ffe14d', '#8a2a00', 'right'); otext(`x${mult()}`, 0, 34, 24, '#fff', '#8a2a00', 'right');
    ctx.fillStyle = 'rgba(0,0,0,.4)'; ctx.fillRect(-110, 56, 110, 7); ctx.fillStyle = '#ffe14d'; ctx.fillRect(-110, 56, 110 * clamp(comboT / 2.6, 0, 1), 7); ctx.restore();
  }
  // missions
  ctx.font = '15px Jua, sans-serif'; let my = H - 70;
  for (const m of missions) { otext((m.done ? '✅ ' : '⬜ ') + m.text, 20, my, 15, m.done ? '#9dff8c' : '#fff', '#222', 'left', 3); my += 22; }
  if (banner) {
    const k = banner.t, a = k < .4 ? k / .4 : k > 2.3 ? (2.8 - k) / .5 : 1;
    ctx.globalAlpha = clamp(a, 0, 1); ctx.save(); ctx.translate(W / 2, 175); const s = 1 + (k < .4 ? (1 - k / .4) * .6 : 0); ctx.scale(s, s);
    otext(banner.text, 0, 0, 56, '#fff6b0', '#8a2a00'); ctx.restore(); ctx.globalAlpha = 1;
  }
}
function speedLines() {
  ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 2;
  for (let i = 0; i < 18; i++) { const y = hsh(i) * H, x = ((hsh(i + 9) * W - t * 2400 * (.6 + hsh(i + 3))) % (W + 200) + W + 200) % (W + 200) - 100; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + 70 + hsh(i) * 90, y); ctx.stroke(); }
}
function drawTitle() {
  drawBG(); ctx.save(); ctx.translate(-camX, 0); drawFG(); ctx.restore();
  const by = GY - 24 - Math.abs(Math.sin(t * 3.2)) * 120, air = Math.abs(Math.sin(t * 3.2)) > .1;
  drawMascot(W / 2 - 220, by - 0, 46, 1, 1, Math.sin(t * 3.2) * .15, { mouth: air ? 'open' : 'smile', blink: (t % 3) < .12, run: air ? undefined : t * 12 });
  ctx.fillStyle = 'rgba(0,0,0,.22)'; ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.translate(W / 2 + 40, 140); ctx.rotate(-.04 + Math.sin(t * 1.5) * .015); ctx.scale(1 + Math.sin(t * 2) * .02, 1 + Math.sin(t * 2) * .02);
  otext('감귤이의', -30, -38, 46, '#fff', '#a34a00'); otext('제주 대모험', 0, 25, 96, '#ffb21a', '#7a2a00', 'center', 14); ctx.restore();
  ctx.save(); ctx.translate(W / 2 + 40, 140); ctx.fillStyle = '#ffe27a'; ctx.globalAlpha = .6 + .4 * Math.sin(t * 5); ctx.font = '40px sans-serif'; ctx.fillText('✨', 280, -40); ctx.fillText('✨', -300, 40); ctx.restore(); ctx.globalAlpha = 1;
  const a = .6 + .4 * Math.sin(t * 4); ctx.globalAlpha = a; otext('스페이스 / 클릭 / 터치로 시작!', W / 2 + 40, 300, 34, '#fff', '#5a2a00'); ctx.globalAlpha = 1;
  ctx.fillStyle = 'rgba(10,20,40,.55)'; ctx.fillRect(W / 2 - 250, 345, 580, 118);
  const lines = ['SPACE / ↑ / 터치 : 점프 (2단 점프, 꾹 누르면 높이)', '↓ / 아래로 스와이프 : 공중 찍기 (주변 적 처치)', '돌하르방 위에서 밟으면 슈퍼 점프!  🧲한라봉 🛡️천혜향 🔥레드향', 'P: 일시정지   M: 소리   V: 음성'];
  lines.forEach((l, i) => otext(l, W / 2 + 40, 367 + i * 26, 17, '#fff', '#000', 'center', 2));
  if (best) otext(`BEST  ${best}`, W / 2 + 40, 490, 24, '#ffe14d', '#5a2a00');
}
function drawOver() {
  ctx.fillStyle = 'rgba(10,10,30,.62)'; ctx.fillRect(0, 0, W, H);
  const k = Math.min(1, stateT * 3), s = 1 + (1 - k) * .4; ctx.save(); ctx.translate(W / 2, H / 2); ctx.scale(s, s); ctx.globalAlpha = k;
  ctx.fillStyle = 'rgba(255,248,230,.96)'; ctx.strokeStyle = '#a34a00'; ctx.lineWidth = 6; ctx.beginPath(); ctx.rect(-250, -190, 500, 380); ctx.fill(); ctx.stroke();
  drawMascot(0, -135, 30, 1, 1, Math.sin(t * 3) * .1, { mouth: 'hurt', blink: false });
  otext('GAME OVER', 0, -85, 46, '#ff6a1a', '#6a2a00');
  otext(`점수  ${Math.floor(score)}`, 0, -35, 40, '#fff', '#a34a00');
  if (P.newBest) otext('🎉 신기록! 🎉', 0, 5, 28, '#ffe14d', '#8a2a00'); else otext(`BEST ${best}`, 0, 5, 24, '#fff', '#5a2a00');
  const st = [`🏁 ${Math.floor(stats.dist)}m`, `🍊 ${stats.tang}개`, `👣 밟은 적 ${stats.stomp}`, `🔥 최대 콤보 ${maxCombo}`];
  st.forEach((x, i) => otext(x, -120 + (i % 2) * 240, 55 + ((i / 2) | 0) * 34, 22, '#fff', '#6a2a00'));
  const ms = missions.filter(m => m.done).length; otext(`미션 ${ms}/3 완료`, 0, 130, 22, ms === 3 ? '#9dff8c' : '#fff', '#2a3a2a');
  if (stateT > .8) { ctx.globalAlpha = .6 + .4 * Math.sin(t * 5); otext('스페이스 / 클릭으로 다시 도전!', 0, 168, 22, '#fff', '#a34a00'); }
  ctx.restore(); ctx.globalAlpha = 1;
}

function draw() {
  ctx.setTransform(2, 0, 0, 2, 0, 0);
  if (state === 'title') { drawTitle(); return; }
  const sh = shake > 0 ? [(rnd() - .5) * shake, (rnd() - .5) * shake] : [0, 0];
  ctx.save(); ctx.translate(sh[0], sh[1]);
  drawBG();
  ctx.save(); ctx.translate(-camX, 0);
  drawFG();
  for (const p of picks) {
    const bob = Math.sin(p.ph) * 4;
    if (p.k === 't') ctx.drawImage(SPR.t, p.x - 17, p.y + bob - 17, 34, 34);
    else if (p.k === 'gold') { const s = 1 + Math.sin(p.ph * 1.5) * .08; ctx.drawImage(SPR.gold, p.x - 26 * s, p.y + bob - 26 * s, 52 * s, 52 * s); }
    else { const s = 1 + Math.sin(p.ph) * .08; ctx.drawImage(SPR['pw_' + p.kind], p.x - 30 * s, p.y + bob - 30 * s, 60 * s, 60 * s); }
  }
  for (const e of ents) { if (e.type === 'hare') drawHare(e); else if (e.type === 'crab') drawCrab(e); else drawGull(e); }
  drawPlayer(); drawParts();
  for (const x of texts) { ctx.globalAlpha = clamp(x.life * 2, 0, 1); otext(x.text, x.x, x.y, x.size, x.col, '#4a1a00'); ctx.globalAlpha = 1; }
  ctx.restore();
  if (powers.fever > 0) { speedLines(); const v = ctx.createRadialGradient(W / 2, H / 2, H * .4, W / 2, H / 2, H * .9); v.addColorStop(0, 'rgba(255,0,0,0)'); v.addColorStop(1, `hsla(${(t * 300) % 360},100%,55%,.4)`); ctx.fillStyle = v; ctx.fillRect(0, 0, W, H); }
  ctx.restore();
  if (flash) { ctx.globalAlpha = clamp(flash.a, 0, 1); ctx.fillStyle = flash.c; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
  drawHUD();
  if (state === 'pause') { ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(0, 0, W, H); otext('⏸ 일시정지', W / 2, H / 2 - 10, 64, '#fff', '#222'); otext('스페이스 / P 로 계속하기', W / 2, H / 2 + 50, 26, '#ffe27a', '#222'); }
  if (state === 'over') drawOver();
}

// ---------------------------------------------------------------------
//  MAIN LOOP
// ---------------------------------------------------------------------
resetGame(); plats = [{ x: -1e6, w: 2e6, y: GY, type: 'g' }]; state = 'title'; P.say = '';
let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  update(dt); draw(); requestAnimationFrame(frame);
}
(document.fonts && document.fonts.load ? document.fonts.load('20px Jua') : Promise.resolve()).catch(() => {}).then(() => requestAnimationFrame(frame));
</script>
